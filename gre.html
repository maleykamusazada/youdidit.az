/* =========================================================
   RENDER
========================================================= */

function renderQuiz(){

    const quiz = document.getElementById("quiz");

    let html = "";

    QUESTIONS.forEach((question,index)=>{

        if(index === 0){

            html += `
                <div class="section-title">
                    Verbal Reasoning — Questions 1–25
                </div>
            `;

        }

        if(index === 25){

            html += `
                <div class="section-title">
                    Quantitative Reasoning — Questions 26–50
                </div>
            `;

        }

        html += `
            <div class="question">

                <div class="question-number">
                    Question ${index + 1}
                </div>

                <div class="question-text">
                    ${question.q}
                </div>

                <div class="options">
        `;

        question.options.forEach((option,optIndex)=>{

            const letter = String.fromCharCode(65 + optIndex);

            html += `
                <label
                    class="option"
                    id="option-${index}-${optIndex}"
                >

                    <input
                        type="radio"
                        name="question-${index}"
                        value="${optIndex}"
                        onchange="selectOption(${index},${optIndex})"
                    >

                    <span class="option-text">
                        <strong>${letter})</strong> ${option}
                    </span>

                </label>
            `;

        });

        html += `
                </div>
            </div>
        `;

    });

    quiz.innerHTML = html;
}


/* =========================================================
   SELECT OPTION
========================================================= */

function selectOption(questionIndex,optionIndex){

    QUESTIONS[questionIndex].options.forEach((_,i)=>{

        const element = document.getElementById(
            `option-${questionIndex}-${i}`
        );

        if(element){
            element.classList.remove("selected");
        }

    });

    const selected = document.getElementById(
        `option-${questionIndex}-${optionIndex}`
    );

    if(selected){
        selected.classList.add("selected");
    }
}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    updateTimer();

    timerInterval = setInterval(()=>{

        remainingTime--;

        updateTimer();

        if(remainingTime <= 0){

            clearInterval(timerInterval);

            submitQuiz(true);

        }

    },1000);
}


function updateTimer(){

    const timer = document.getElementById("timer");

    const minutes = Math.floor(remainingTime / 60);
    const seconds = remainingTime % 60;

    timer.textContent =
        "Time remaining: " +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0");

    timer.classList.remove("warning","danger");

    if(remainingTime <= 300){

        timer.classList.add("danger");

    }else if(remainingTime <= 600){

        timer.classList.add("warning");

    }
}


/* =========================================================
   SUBMIT
========================================================= */

function submitQuiz(autoSubmit = false){

    if(submitted){
        return;
    }

    const unanswered = [];

    QUESTIONS.forEach((question,index)=>{

        const selected = document.querySelector(
            `input[name="question-${index}"]:checked`
        );

        if(!selected){
            unanswered.push(index + 1);
        }

    });


    if(!autoSubmit && unanswered.length > 0){

        const proceed = confirm(
            "You have " +
            unanswered.length +
            " unanswered question(s).\n\n" +
            "Do you want to submit the test anyway?"
        );

        if(!proceed){
            return;
        }

    }


    submitted = true;

    clearInterval(timerInterval);

    document.getElementById("submitBtn").disabled = true;


    let score = 0;

    const review = [];


    QUESTIONS.forEach((question,index)=>{

        const selected = document.querySelector(
            `input[name="question-${index}"]:checked`
        );

        const selectedAnswer = selected
            ? Number(selected.value)
            : null;

        const correct =
            selectedAnswer === question.a;

        if(correct){
            score++;
        }

        review.push({
            number:index + 1,
            selected:selectedAnswer,
            correct:question.a,
            options:question.options
        });

    });


    showResult(score,review,autoSubmit);

    window.scrollTo({
        top:document.getElementById("result").offsetTop - 100,
        behavior:"smooth"
    });
}


/* =========================================================
   RESULT
========================================================= */

function showResult(score,review,autoSubmit){

    const result = document.getElementById("result");

    const percentage = Math.round(
        score / QUESTIONS.length * 100
    );


    let html = `

        <div class="result-score">
            ${score} / ${QUESTIONS.length}
        </div>

        <div class="result-percent">
            Score: ${percentage}%
        </div>

        <div class="review">

            <h3>Answer Review</h3>

    `;


    review.forEach(item=>{

        const correctLetter =
            String.fromCharCode(65 + item.correct);


        if(item.selected === item.correct){

            html += `

                <div class="review-item correct">

                    <div class="review-title">
                        Question ${item.number}
                    </div>

                    <div class="correct-text">
                        ✓ Correct
                    </div>

                </div>

            `;

        }else{

            let selectedText = "Not answered";

            if(item.selected !== null){

                selectedText =
                    String.fromCharCode(65 + item.selected) +
                    ") " +
                    item.options[item.selected];

            }


            html += `

                <div class="review-item incorrect">

                    <div class="review-title">
                        Question ${item.number}
                    </div>

                    <div class="incorrect-text">
                        ✗ Your answer: ${selectedText}
                    </div>

                    <div class="correct-text">
                        ✓ Correct answer:
                        ${correctLetter}) ${item.options[item.correct]}
                    </div>

                </div>

            `;

        }

    });


    html += `
        </div>
    `;


    result.innerHTML = html;

    result.style.display = "block";
}


/* =========================================================
   START TEST
========================================================= */

renderQuiz();
startTimer();

</script>
