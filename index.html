<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youdidit.az — Tələbələr üçün resurs və imtahan mərkəzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --aur-bg-deep:  #0a0714;
    --aur-bg-mid:   #1c1030;
    --aur-bg-glow:  #3a2166;
    --aur-ink:      #f4f1fb;
    --aur-ink-dim:  #b9aed6;
    --aur-spark-2:  #d8bfff;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--aur-bg-deep);
    color: var(--aur-ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .aur-hero{
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 50% at 50% 8%, var(--aur-bg-glow) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, #150c28 0%, transparent 70%),
      linear-gradient(180deg, var(--aur-bg-deep) 0%, var(--aur-bg-mid) 55%, #120a22 100%);
  }

  .aur-stars, .aur-stars2{
    position: absolute; inset: -10%;
    width: 120%; height: 120%;
    pointer-events: none;
  }
  .aur-stars{
    background-image:
      radial-gradient(1.5px 1.5px at 12% 20%, var(--aur-spark-2) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 82% 15%, var(--aur-spark-2) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 65%, var(--aur-ink-dim) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 72%, var(--aur-ink-dim) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 55%, var(--aur-spark-2) 0%, transparent 100%);
    opacity: 0.8;
    animation: aur-drift-slow 50s linear infinite;
  }
  .aur-stars2{
    background-image:
      radial-gradient(1px 1px at 18% 40%, #ffffff 0%, transparent 100%),
      radial-gradient(1.2px 1.2px at 55% 25%, var(--aur-spark-2) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 82%, #ffffff 0%, transparent 100%);
    opacity: 0.6;
    animation: aur-drift-fast 34s linear infinite reverse;
  }
  @keyframes aur-drift-slow{ 0%{transform:translate3d(0,0,0);} 100%{transform:translate3d(-6%,-4%,0);} }
  @keyframes aur-drift-fast{ 0%{transform:translate3d(0,0,0);} 100%{transform:translate3d(5%,-6%,0);} }

  .aur-card{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 820px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .aur-brand{
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: var(--aur-ink-dim);
    text-transform: uppercase;
  }

  .aur-card h1{
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: clamp(28px, 6vw, 48px);
    line-height: 1.1;
    color: var(--aur-ink);
  }

  .aur-sub{
    max-width: 540px;
    color: var(--aur-ink-dim);
    font-size: 14px;
    line-height: 1.5;
    padding: 0 10px;
  }

  .aur-emblem{
    width: 130px;
    height: 130px;
    margin: 4px 0;
    filter: drop-shadow(0 0 20px rgba(155,127,232,0.5));
  }

  .aur-icon-row{
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }
  .aur-icon-item{ 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 8px; 
  }
  .aur-icon-circle{
    position: relative;
    width: 52px; 
    height: 52px;
    border-radius: 50%;
    display: flex; 
    align-items: center; 
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(155,127,232,0.35), rgba(155,127,232,0.05) 70%);
    box-shadow: 0 0 12px rgba(180,150,255,0.4);
  }
  .aur-icon-circle svg{ 
    width: 22px; 
    height: 22px; 
    stroke: var(--aur-ink); 
    fill: none; 
    stroke-width: 1.6; 
  }
  .aur-icon-label{
    font-size: 12px;
    font-weight: 600;
    color: var(--aur-ink);
  }

  .aur-cta{
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 38px;
    border-radius: 999px;
    border: 1px solid rgba(244,241,251,0.7);
    color: var(--aur-ink);
    background: transparent;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  .aur-cta:hover{
    background: var(--aur-ink);
    color: #160c2b;
    box-shadow: 0 0 20px rgba(216,191,255,0.5);
  }

  .aur-zappable{ cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; }
  @keyframes aur-zap-flash {
    0% { filter: brightness(1); }
    30% { filter: brightness(2.2) drop-shadow(0 0 12px rgba(216,191,255,0.8)); }
    100% { filter: brightness(1); }
  }
  .aur-zap-anim { animation: aur-zap-flash 0.5s ease-out; }
</style>
</head>
<body>

<section class="aur-hero">
  <div class="aur-stars"></div>
  <div class="aur-stars2"></div>

  <div class="aur-card">
    <div class="aur-brand aur-zappable">youdidit.az</div>

    <h1>Öyrənməyə davam<br>etmək üçün bir ünvan.</h1>
    <p class="aur-sub">Youdidit.az tələbələrə üç şeydə kömək edir: doğru resursu tapmaq, öz səviyyəsini müəyyən etmək və sərbəst iş prezentasiyasını vaxtında hazırlatmaq.</p>

    <svg class="aur-emblem aur-zappable" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="arrowGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#12213f"/>
          <stop offset="45%" stop-color="#3a2d78"/>
          <stop offset="100%" stop-color="#6b4fc9"/>
        </linearGradient>
        <linearGradient id="peakBack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2a7f96"/>
          <stop offset="100%" stop-color="#175267"/>
        </linearGradient>
        <linearGradient id="peakFront" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1b5f75"/>
          <stop offset="100%" stop-color="#0d3a48"/>
        </linearGradient>
      </defs>

      <polygon points="52,168 100,72 148,168" fill="url(#peakBack)"/>
      <polygon points="30,178 78,92 126,178" fill="url(#peakFront)"/>
      <path d="M62 178 L100 118 L86 108 L138 46 L134 84 L152 70 L132 118 L112 104 L98 128 Z" fill="url(#arrowGrad)"/>
    </svg>

    <div class="aur-icon-row">
      <div class="aur-icon-item">
        <div class="aur-icon-circle aur-zappable">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/></svg>
        </div>
        <div class="aur-icon-label">Resurslar</div>
      </div>
      <div class="aur-icon-item">
        <div class="aur-icon-circle aur-zappable">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-3.5 6-3-2.5L12 6z"/></svg>
        </div>
        <div class="aur-icon-label">İmtahanlar</div>
      </div>
      <div class="aur-icon-item">
        <div class="aur-icon-circle aur-zappable">
          <svg viewBox="0 0 24 24"><path d="M4 20L12 4l8 16"/><path d="M9 14h6"/></svg>
        </div>
        <div class="aur-icon-label">İnkişaf Yolu</div>
      </div>
      <div class="aur-icon-item">
        <div class="aur-icon-circle aur-zappable">
          <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        </div>
        <div class="aur-icon-label">Sifariş Et</div>
      </div>
    </div>

    <a href="#" class="aur-cta aur-zappable">Başla</a>
  </div>
</section>

<script>
  document.querySelectorAll('.aur-zappable').forEach(function(el){
    el.addEventListener('click', function(){
      el.classList.remove('aur-zap-anim');
      void el.offsetWidth;
      el.classList.add('aur-zap-anim');
    });
  });
</script>
</body>
</html>
