.q{font-weight:600;margin:16px 0 0}.res{font-weight:700;margin:12px 0 0}ul{padding-left:20px;margin:6px 0}

var M=[
{t:"İR-ə giriş və Azərbaycan bazarı",b:["<p><b>İR</b> təşkilatın işçilərini cəlb etmək, inkişaf etdirmək, motivasiya etmək və saxlamaq sistemidir. Əsas bloklar: planlaşdırma, işə qəbul, adaptasiya, performans, təlim, kompensasiya, əmək münasibətləri, əmək təhlükəsizliyi və İR analitikası.</p><p><b>Ulrich modeli (qlobal):</b> İR-in 4 rolu — strateji tərəfdaş, inzibati ekspert, işçi müdafiəçisi (employee champion) və dəyişiklik agenti. SHRM və CIPD kimi qlobal qurumların kompetensiya çərçivələri də buna əsaslanır.</p><p><b>Azərbaycan konteksti:</b> əmək münasibətləri Əmək Məcəlləsi ilə tənzimlənir; dövlət tərəfdən Əmək və Əhalinin Sosial Müdafiəsi Nazirliyi (ƏMAS), vergi və sosial sığorta üzrə Vergilər Nazirliyi və DSMF vacibdir. Vakansiyalar əsasən boss.az, jobsearch.az, hellojob.az və LinkedIn-də yerləşdirilir.</p>"],
q:[["Ulrich modelində «employee champion» rolu nəyi bildirir?","İşçilərin ehtiyacları və bağlılığı ilə məşğul olmağı","Dövlət orqanları ilə sənədləşməni aparmağı","Şirkətin maliyyə hesabatlarını hazırlamağı","Yalnız vakansiya elanlarını yerləşdirməyi"],["Hansı fəaliyyət İR-in strateji töhfəsinə nümunədir?","Biznes planına uyğun kadr ehtiyacı proqnozu","Kadr əmrlərinin hazırlanması","İş vaxtı uçotunun aparılması","Statistik hesabatların təqdimi"],["3 ayda eyni rəhbərin komandasından 5 işçi ayrılıb. İlk addım?","Ayrılma müsahibələrini və rəhbərlik üslubunu təhlil etmək","Bütün işçilərin maaşını artırmaq","Yeni işçilər üçün sınaq müddətini uzatmaq","Hadisəni təsadüf sayıb gözləmək"]],
k:"50 işçisi olan Azərbaycan şirkəti üçün İR şöbəsinin ilk 3 prioritetini yazın və hər birinin niyə vacib olduğunu izah edin.",c:["3 konkret prioritet","Hər biri üçün əsaslandırma","Azərbaycan reallığı (qanun, bazar) nəzərə alınıb"]},
{t:"İşə qəbul və seçim",s:"f",b:["<p>Proses: ehtiyac → vəzifə təlimatı (JD) → elan → CV seçimi → telefon müsahibəsi → əsas müsahibə/test → referans yoxlaması → təklif. Aşağıdakı qıf həmişə daralır, ona görə hər mərhələnin keçid faizini izləyin.</p>","<p><b>STAR metodu:</b> Situasiya, Tapşırıq, Fəaliyyət, Nəticə — namizəd real təcrübəsini bu ardıcıllıqla danışır. Bütün namizədlərə eyni suallar və eyni qiymətləndirmə şkalası verilir (strukturlaşdırılmış müsahibə).</p><p><b>Metriklər:</b> time-to-hire, cost-per-hire = ümumi işə qəbul xərci ÷ işə götürülənlər, offer acceptance rate, 90 günlük saxlanma.</p><p class='tip'>Azərbaycan Əmək Məcəlləsi əmək sahəsində ayrı-seçkiliyi qadağan edir: cins, yaş, ailə vəziyyəti, əlillik və s. üzrə sual verməyin. Sənədlər: şəxsiyyət vəsiqəsi, təhsil sənədi, əmək kitabçası, hərbi uçot (kişilər üçün).</p>"],
q:[["STAR metodu nədir?","Davranış cavabını Situasiya–Tapşırıq–Fəaliyyət–Nəticə ilə qurmaq","Namizədin maaş gözləntisini hesablama düsturu","Təklif məktubunun standart forması","Reklam elanının dörd bölməsi"],["Cost-per-hire necə hesablanır?","Ümumi işə qəbul xərcləri ÷ işə götürülənlərin sayı","İşə götürülənlərin sayı ÷ müraciətlərin sayı","Orta maaş × namizəd sayı","Elan müddəti ÷ müsahibə sayı"],["Müsahibədə qadın namizəddən yaxın zamanda hamilə qalmağı planlaşdırıb-planlaşdırmadığını soruşmaq:","Ayrı-seçkilik sayıla bilər və qanuna ziddir","Yalnız rəhbər razı olarsa mümkündür","Yalnız sınaq müddətində mümkündür","Yazılı razılıqla həmişə mümkündür"]],
k:"Satış meneceri vəzifəsi üçün 3 davranış (STAR) sualı yazın və hər biri üçün qiymətləndirmə meyarı göstərin.",c:["Suallar keçmiş təcrübəyə əsaslanır","Hər sual üçün ölçü/meyar var","Ayrı-seçkilik xarakterli sual yoxdur"]},
{t:"Adaptasiya (onboarding)",s:"t",b:["<p>Adaptasiya <b>pre-boarding</b> (təklif qəbul edildikdən işə başlayanadək) ilə başlayır: sənədlər, iş yeri, hesablar, salamlama məktubu. Birinci gün: komanda, qaydalar, mentor, iş təhlükəsizliyi təlimatı.</p><p><b>30-60-90 plan:</b> 30 gün — öyrənmə; 60 gün — ilk müstəqil töhfə və ara rəy; 90 gün — tam məsuliyyət və sınaq müddətinin yekunu.</p><p>Azərbaycanda əmək müqaviləsində sınaq müddəti təyin oluna bilər (ümumi qaydada 3 ayadək; xüsusi hallar üçün qanuna baxın). Sınaq müddəti işçinin hüquqlarını azaltmaq vasitəsi deyil: əmək haqqı və sosial sığorta tam qüvvədədir.</p>"],
q:[["Sınaq müddətinin əsas məqsədi nədir?","Tərəflərin bir-birinə uyğunluğunu yoxlamaq","Əmək haqqını ödəməmək üçün hüquqi əsas yaratmaq","Müqaviləni şifahi saxlamaq","İşçini məzuniyyət hüququndan məhrum etmək"],["Pre-boarding nədir?","Təklif qəbulundan işə başlanğıca qədər hazırlıq mərhələsi","İşdən çıxan işçinin təhvil-təslimi","Sınaq müddətindən sonrakı qiymətləndirmə","Namizədlərin ilkin test mərhələsi"],["90 günlük planın 60-cı günündə ən vacib addım?","Rəhbərlə ara rəy görüşü və məqsədlərin dəqiqləşməsi","Əmək haqqı artımı barədə yekun qərar","Bütün siyasətlərin əzbərlənməsi","Mentorun komandadan çıxarılması"]],
k:"Ofis işçisi üçün ilk 30 günlük adaptasiya planını həftə-həftə yazın.",c:["4 həftə üzrə bölgü","Mentor və rəy görüşləri","Ölçülə bilən gözləntilər"]},
{t:"Əmək Məcəlləsi əsasları",b:["<p><b>Əmək müqaviləsi</b> yazılı bağlanır (iki nüsxə), müddətsiz və ya müddətli (tərəflərin razılaşdığı müddətə) ola bilər. Mütləq elementlər: tərəflər, iş yeri, əmək funksiyası, əmək haqqı, iş rejimi, başlama tarixi. Müqavilə ƏMAS-ın elektron sistemində qeydə alınır.</p><ul><li><b>İş vaxtı:</b> həftədə 40 saatadək (gündə 8 saat); gecə (22:00–06:00), bayram və əlavə iş üçün artırılmış ödəniş.</li><li><b>Məzuniyyət:</b> əsas məzuniyyət ildə ən azı 21 təqvim günü; əlavə məzuniyyətlər (staj, zərərli şərait) ayrıca.</li><li><b>Xitam:</b> işçi 1 ay əvvəl xəbərdar edir; ştat ixtisarında işəgötürən stajdan asılı olaraq 2–9 həftə əvvəl xəbərdar edir və staja görə işdənçıxarma müavinəti ödəyir; ödənişləri verir.</li><li><b>İntizam:</b> xəbərdarlıq, töhmət, ağır töhmət, işdən azad etmə — yazılı izahat tələb olunur və müddətlərə riayət edilməlidir.</li></ul><p class='tip'>Maddələr tez-tez dəyişir (məsələn, 2026-cı ildə minimum əmək haqqına illik baxış normaları əlavə olunub). Hər qərardan əvvəl e-qanun.az-da aktual redaksiyanı yoxlayın.</p>"],
q:[["İşçi öz təşəbbüsü ilə müqaviləyə xitam verərkən əsas qayda nədir?","1 ay əvvəl xəbərdarlıq","10 gün əvvəl xəbərdarlıq","3 ay əvvəl xəbərdarlıq","Xəbərdarlıq tələb olunmur"],["Ştat ixtisarında 3 illik stajı olan işçi ən azı nə qədər əvvəl xəbərdar edilməlidir?","Ən azı 4 təqvim həftəsi","Ən azı 2 təqvim həftəsi","Ən azı 6 təqvim həftəsi","Ən azı 9 təqvim həftəsi"],["Hansı məlumat əmək müqaviləsinə daxil edilməlidir?","İş yeri, əmək funksiyası və əmək haqqı","Əvvəlki iş yerlərindəki maaşlar","Şirkətin növbəti il işə qəbul planı","İşçinin ixtisar ehtimalı olan tarix"]],
k:"Sınaq müddəti 3 aydır. 2-ci ayda işçi performansa görə uyğun görünmür. İşəgötürən hansı addımları atmalıdır və hansı hüquqi risklər var?",c:["Yazılı rəy və sənədləşdirmə","Qanuni xitam prosedurunun qeyd olunması","Risklərin (ayrı-seçkilik, prosedur pozuntusu) göstərilməsi"]},
{t:"Əmək haqqı, vergilər, sosial sığorta və Excel",x:1,b:["<p><b>Minimum əmək haqqı:</b> 400 AZN (2025-dən). <b>DSMF (qeyri-dövlət, qeyri-neft sektoru, 2026, vergilər nazirliyinin məlumatı):</b> işçi hissəsi 200 AZN-dək 3%, üstü 6 AZN + 200-dən yuxarı hissənin 10%; işəgötürən 44 AZN + 200-dən yuxarı hissənin 15% (8000 AZN-ə qədər). Əlavə: işsizlik və icbari tibbi sığorta. <b>Gəlir vergisi:</b> əsas iş yerində ilk 200 AZN azaddır, 200–2500 arası 14% (600 AZN → (600−200)×14% = 56 AZN).</p><p class='tip'>Dərəcələr və 2500+ pillələri tez dəyişir: hesablama aparmazdan əvvəl taxes.gov.az-ı yoxlayın. Aşağıdakı kalkulyator öyrənmək üçündür, rəsmi hesablama deyil.</p><p><b>Excel:</b> <code>=MAX(0;B2-200)*14%</code> (gəlir vergisi), <code>=IF(B2&lt;=200;B2*3%;6+(B2-200)*10%)</code> (DSMF işçi), <code>=IF(B2&lt;=200;B2*22%;44+(B2-200)*15%)</code> (DSMF işəgötürən). Ayırıcı (; və ya ,) Excel-in region ayarından asılıdır. Maaş cədvəli üçün SUMIFS, XLOOKUP və PivotTable əsas alətlərdir.</p><div class='card'><b>Kalkulyator</b> (qros AZN)<input type='number' id='gr' placeholder='məs. 1000'><div id='co' class='mut'></div></div>"],
q:[["Aylıq 1000 AZN qros maaşda işçinin DSMF hissəsi (6 + 10%×800)?","86 manat","100 manat","164 manat","30 manat"],["200 AZN azadolma ilə gəlir vergisini (14%) hesablayan Excel düsturu?","=MAX(0;B2-200)*14%","=B2*14%-200","=MIN(B2;200)*14%","=(B2+200)*14%"],["Qüvvədə olan minimum əmək haqqı (2025-dən)?","400 AZN","345 AZN","450 AZN","500 AZN"]],
k:"İşçinin qros maaşı 1800 AZN-dir. İşəgötürənin DSMF payını hesablayın, addımları və Excel düsturunu göstərin.",c:["44 + (1800−200)×15% = 284 AZN","Düstur düzgün yazılıb","Addımlar aydın göstərilib"]},
{t:"Kadr sənədləri və İR proqramları",b:["<p><b>Sənədlər:</b> əmək müqaviləsi, qəbul/köçürmə/xitam əmrləri, iş vaxtı tabeli, məzuniyyət cədvəli, şəxsi iş, əmək kitabçası. Şəxsi məlumatlar «Fərdi məlumatlar haqqında» qanuna uyğun qorunmalıdır (giriş hüququ, saxlama müddəti).</p><p><b>Excel-də İR:</b> <code>DATEDIF(B2;TODAY();\"Y\")</code> — staj; <code>COUNTIFS</code> — şöbə üzrə say; <code>XLOOKUP</code> — işçi kartı; Data Validation — səhvsiz daxiletmə; Conditional Formatting — məzuniyyət/müqavilə bitmə xəbərdarlığı; PivotTable + Power BI — hesabatlar.</p><p><b>Sistemlər:</b> HRIS (BambooHR, Workday, SAP SuccessFactors), ATS (Greenhouse, Lever, Recruitee), ERP/mühasibat (1C, SAP). Azərbaycanda kiçik şirkətlər çox vaxt Excel + 1C ilə başlayır.</p>"],
q:[["İşçinin stajını il ilə hesablayan Excel funksiyası?","=DATEDIF(B2;TODAY();\"Y\")","=COUNTIF(B2;TODAY())","=SUMIF(B2;TODAY();\"Y\")","=VLOOKUP(B2;TODAY();\"Y\")"],["Şöbələr üzrə işçi sayını və orta maaşı tez çıxarmaq üçün ən uyğun alət?","PivotTable","Goal Seek","Text to Columns","Data Validation"],["ATS nədir?","Namizəd müraciətlərini izləyən sistem","Əmək haqqı hesablama modulu","İş vaxtı terminalı","Təlim videoları platforması"]],
k:"50 işçisi olan şirkət üçün Excel əsaslı İR bazası qurun: hansı sütunlar, hansı düsturlar və hansı 3 hesabat?",c:["Sütunlar məntiqlidir","Ən azı 2 düstur","3 faydalı hesabat","Məlumat məxfiliyi qeyd olunub"]},
{t:"Performans, KPI və OKR",s:"b",b:["<p><b>KPI</b> davamlı göstəricidir (məs. satış planının icrası). <b>OKR</b> (Objective + Key Results) iddialı məqsəd və 3–5 ölçülən nəticədir. <b>Balanced Scorecard</b> (Kaplan–Norton): maliyyə, müştəri, proses, öyrənmə perspektivləri. Məqsədlər SMART olmalıdır.</p><p><b>İR KPI-ləri:</b> işçi dövriyyəsi = ayrılanlar ÷ orta say × 100; time-to-fill; devamsızlıq; eNPS; təlimə görə performans artımı; plan üzrə saxlanma.</p><p><b>Qiymətləndirmə:</b> 360°, 9-box matrisi (performans × potensial), rəy görüşləri, uyğunsuzluq halında PIP (performans yaxşılaşdırma planı). Kalibrasiya görüşləri qərəzi azaldır.</p>"],
q:[["KPI ilə OKR fərqi nədir?","OKR iddialı məqsəd və nəticələrə, KPI isə davamlı göstəricilərə əsaslanır","KPI yalnız İR-də, OKR yalnız satışda işlənir","OKR maaş hesablamasıdır, KPI isə təlim planıdır","KPI rüblük, OKR isə yalnız illik olur"],["Ay başı 100, ay sonu 96 işçi; 6 nəfər ayrılıb, 2 nəfər qəbul olunub. Aylıq dövriyyə?","6,1%","4,0%","3,1%","12,2%"],["9-box matrisi nəyi müqayisə edir?","Performans və potensialı","Maaş və stajı","Yaş və davamiyyəti","Xərc və gəliri"]],
k:"Satış meneceri üçün 4 KPI və 1 OKR (1 məqsəd, 3 əsas nəticə) yazın. Hər biri ölçü və müddətlə olsun.",c:["KPI-lər ölçülə bilən","OKR-də iddialı məqsəd + 3 nəticə","Müddət göstərilib"]},
{t:"Təlim və inkişaf",b:["<p><b>TNA</b> (təlim ehtiyacı təhlili): performans boşluğunu müəyyən et → səbəbi (bilik, bacarıq, motivasiya, proses) ayır → həll seç. Hər problem təlim problemi deyil.</p><p><b>Kirkpatrick 4 səviyyə:</b> 1 Reaksiya, 2 Öyrənmə, 3 Davranış (işdə tətbiq), 4 Nəticələr (biznes göstəriciləri). <b>70-20-10:</b> inkişafın ~70%-i iş təcrübəsi, 20%-i başqalarından öyrənmə, 10%-i formal təlimdir.</p><p>İnkişaf alətləri: fərdi inkişaf planı (IDP), mentorluq, rotasiya, e-öyrənmə (Coursera, LinkedIn Learning), xarici sertifikatlar (SHRM, CIPD). Təlim ROI = (fayda − xərc) ÷ xərc.</p>"],
q:[["Kirkpatrick modelinin 3-cü səviyyəsi nəyi ölçür?","Öyrənilənlərin işdə tətbiqi (davranış)","Təlimdən məmnunluğu","Test nəticələrini","Şirkətin illik mənfəətini"],["70-20-10 modelində 70% nəyi ifadə edir?","İş təcrübəsi ilə öyrənməni","Auditoriya təlimini","Mentorluğu","Onlayn kursları"],["TNA-da ilk addım hansıdır?","Performans boşluğunu müəyyən etmək","Təlim büdcəsini bölmək","Təlimçini seçmək","Sertifikat şablonu hazırlamaq"]],
k:"Yeni təyin olunmuş komanda lideri üçün 3 aylıq inkişaf planı yazın və Kirkpatrick səviyyələri ilə effektivliyi necə ölçəcəyinizi göstərin.",c:["Konkret fəaliyyətlər (70-20-10)","Ən azı 3 Kirkpatrick səviyyəsi","Ölçü və müddət"]},
{t:"Motivasiya və kompensasiya",b:["<p><b>Nəzəriyyələr:</b> Maslow (ehtiyaclar iyerarxiyası), Herzberg (gigiyena amilləri narazılığı azaldır, motivatorlar həvəs yaradır), Adams (ədalət nəzəriyyəsi — işçi öz payını başqaları ilə müqayisə edir).</p><p><b>Kompensasiya sistemi:</b> vəzifələrin qiymətləndirilməsi (Hay/Mercer kimi metodlar) → grade-lər → maaş vilkələri → bazar benchmarkinqi. <b>Compa-ratio</b> = işçi maaşı ÷ vilkənin/bazarın median maaşı. 1,0 ətrafı normaldır; 0,85 — bazardan 15% aşağı deməkdir.</p><p><b>Paket:</b> əsas maaş, bonus, icbari və könüllü tibbi sığorta, yemək/nəqliyyat, təlim, çevik qrafik. Bonuslar vergi və DSMF baxımından xüsusi qaydalara tabedir — mühasibatla yoxlayın.</p>"],
q:[["Compa-ratio 0,85 nəyi göstərir?","Maaşın median göstəricidən təxminən 15% aşağı olduğunu","Maaşın 85 AZN olduğunu","İşçinin 85% performans göstərdiyini","Bonusun 85% ödənildiyini"],["Adams-ın ədalət nəzəriyyəsinə görə narazılıq nədən yaranır?","Öz nisbətini başqalarının nisbəti ilə müqayisədə ədalətsiz görməkdən","Yalnız maaşın aşağı olmasından","İş saatlarının çoxluğundan","Rəhbərin dəyişməsindən"],["Yüksək performanslı işçi tanınma olmadığı üçün gedir. Herzberg-ə görə ən düzgün cavab?","Motivatorları (tanınma, inkişaf, məsuliyyət) gücləndirmək","Yalnız gigiyena amillərini yaxşılaşdırmaq","Bonus şərtlərini gizli saxlamaq","Rəy sistemini ləğv etmək"]],
k:"5 pilləli grading strukturu üçün 4 prinsip yazın və maaş ədalətliliyini (daxili və bazar) necə yoxlayacağınızı izah edin.",c:["Vəzifə dəyəri əsasdır","Benchmarking/compa-ratio","Şəffaflıq və meyarlar"]},
{t:"Əmək münasibətləri, təhlükəsizlik və yekun",b:["<p><b>İntizam və şikayət:</b> hadisənin yazılı sənədləşdirilməsi, işçidən yazılı izahat, qərarın əsaslandırılması, müddətlərə riayət. <b>İşdən çıxış:</b> exit interview, təhvil-təslim, yekun hesablaşma, istifadə olunmamış məzuniyyət kompensasiyası.</p><p><b>Əmək təhlükəsizliyi (OSH):</b> təlimat, risk qiymətləndirməsi, qəza halında araşdırma. <b>Mədəniyyət və DEI:</b> təqib və ayrı-seçkiliyə qarşı siyasət, eyni dəyərli işə bərabər haqq. Beynəlxalq standartlar: ILO konvensiyaları, ISO 30414 (İR hesabatlılığı).</p><p><b>Yekun prinsip:</b> İR qərarları qanuni, ədalətli, sənədləşdirilmiş və ölçülə bilən olmalıdır.</p>"],
q:[["İntizam tədbiri tətbiq etməzdən əvvəl ilk vacib addım?","İşçidən yazılı izahat almaq və faktları sənədləşdirmək","Dərhal işdən azad etmək","Digər işçilərin rəyini ictimailəşdirmək","Maaşdan kəsmə etmək"],["Exit interview-nun ən düzgün istifadəsi?","Dövriyyə səbəblərini təhlil edib sistemli tədbir görmək","Ayrılanı fikrindən döndərmək","Rəhbərə qarşı sübut toplamaq","Yalnız formal sənəd kimi arxivləşdirmək"],["Aşağıdakılardan hansı İR-in məlumat qorunmasına uyğun davranışıdır?","Maaş məlumatlarına yalnız səlahiyyətli şəxslərin çıxışı","Şəxsi işləri ümumi qovluqda saxlamaq","Maaş cədvəlini mesencerdə paylaşmaq","Namizəd CV-lərini müddətsiz açıq saxlamaq"]],
k:"Şirkətdə bir işçi həmkarı barədə təqib şikayəti verib. İR kimi addım-addım nə edərdiniz? Qanuni risk və ədalətli prosesi qeyd edin.",c:["Məxfilik və qorunma","Tərəflərin dinlənilməsi və sənədləşmə","Nəticə, tədbir və təqib"]}

var st=document.createElement('style');st.textContent='.bd{display:inline-block;background:var(--g);color:#fff;font-size:.78rem;font-weight:700;border-radius:20px;padding:2px 10px}.fi{animation:fi .7s both}@keyframes fi{from{opacity:0;transform:translateY(10px)}}.gr{transform-box:fill-box;transform-origin:left;animation:gx 1.4s ease-out both}@keyframes gx{from{transform:scaleX(0)}}.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vs>div{border-radius:10px;padding:8px 10px;font-size:.92rem}.vs .x{border:1px solid var(--bad)}.vs .v{border:1px solid var(--a)}.vs b{display:block}@media (prefers-reduced-motion:reduce){.fi,.gr{animation:none}}';document.head.appendChild(st);
function flow(a){var h=Math.ceil(a.length/3)*60,s='<svg viewBox="0 0 300 '+h+'">';a.forEach(function(t,i){var x=8+(i%3)*98,y=8+Math.floor(i/3)*60;s+='<g class="fi" style="animation-delay:'+(i*.45)+'s"><rect x="'+x+'" y="'+y+'" width="88" height="42" rx="9" fill="#2e7d6b"/><circle cx="'+(x+10)+'" cy="'+(y+10)+'" r="8" fill="#b8901f"/><text x="'+(x+10)+'" y="'+(y+14)+'" text-anchor="middle" style="fill:#fff;font-size:10px">'+(i+1)+'</text><text x="'+(x+44)+'" y="'+(y+29)+'" text-anchor="middle" style="fill:#fff;font-size:11px">'+t+'</text></g>'});return s+'</svg>'}
function bars(a){var s='<svg viewBox="0 0 300 '+(a.length*30+6)+'">';a.forEach(function(r,i){var y=4+i*30,w=r[1]*1.6;s+='<text x="2" y="'+(y+16)+'" style="font-size:11px">'+r[0]+'</text><rect class="gr" style="animation-delay:'+(i*.35)+'s" x="100" y="'+y+'" width="'+w+'" height="22" rx="5" fill="'+(i%2?'#4a9a88':'#2e7d6b')+'"/><text x="'+(104+w)+'" y="'+(y+16)+'" style="font-size:11px">'+r[1]+'</text>'});return s+'</svg>'}
function vs(a,b){return '<div class="vs"><div class="x"><b>✗ Səhv</b>'+a+'</div><div class="v"><b>✓ Düzgün</b>'+b+'</div></div>'}

M[0].L=[
['Bənzətmə','İR nədir? Futbol klubu nümunəsi',`<p>Təsəvvür edin ki, şirkət futbol klubudur. <b>Baş məşqçi</b> taktikanı qurur (rəhbərlik), <b>maliyyə direktoru</b> büdcəni idarə edir. <b>İR isə idman direktorudur:</b> düzgün oyunçuları tapır, komandaya uyğunlaşdırır, məşq etdirir, performansa baxır, maaş və bonus sistemini qurur, oyunçu ayrılanda səbəbini araşdırır.</p><p>Yaxşı komanda yalnız ulduz oyunçularla yox, <b>düzgün oyunçu + düzgün mövqe + düzgün şərait</b> ilə qurulur. İR-in işi də eynilə budur: düzgün insan, düzgün vəzifədə, düzgün idarəetmə ilə.</p>`+flow(['Planlaşdırma','İşə qəbul','Adaptasiya','Təlim','Performans','Mükafat'])+`<p class="mut">Yuxarıdakı 6 mərhələ işçinin şirkətdəki həyat dövrəsidir (employee lifecycle). Sonda çıxış və yeni dövrə başlayır.</p>`],
['Tarixçə','Kadr şöbəsindən strateji İR-ə',`<p>Əvvəllər təşkilatlarda <b>kadrlar şöbəsi</b> var idi: işçi şəxsi işləri, əmrlər, tabellər, məzuniyyət cədvəli. Bu gün gözlənti daha genişdir: işçi bağlılığı, istedadların saxlanması, bonus strukturu, rəqəmsal İR hesabatları.</p>`+flow(['Kadr uçotu','Əmək münasibətləri','İR idarəetməsi','Strateji İR','İR analitikası','Rəqəmsal İR'])+`<p><b>Niyə vacibdir?</b> Çünki xidmət və texnologiya şirkətlərində xərcin çoxu əmək haqqıdır. Yanlış işə qəbul və ya yüksək dövriyyə birbaşa pul itkisidir. Məsələn, bir işçini əvəz etmək çox vaxt illik maaşının əhəmiyyətli hissəsinə başa gəlir (axtarış, təlim, itirilmiş məhsuldarlıq).</p>`],
['Model','Ulrich-un 4 rolu: real nümunələrlə',`<p>Dave Ulrich İR-in dörd rolunu ayırıb. Hər birinə Azərbaycan şirkətindən nümunə:</p><ul><li><b>Strateji tərəfdaş:</b> şirkət 2 yeni filial açır → İR 12 aylıq kadr planı, maaş büdcəsi və işə qəbul təqvimi hazırlayır.</li><li><b>İnzibati ekspert:</b> müqavilələr, əmrlər, ƏMAS elektron qeydiyyatı, DSMF hesabatları vaxtında və səhvsiz olur.</li><li><b>İşçi müdafiəçisi:</b> işçi tükənmişlikdən şikayətlənir → İR söhbət aparır, iş yükünü rəhbərlə yenidən bölür.</li><li><b>Dəyişiklik agenti:</b> yeni CRM sisteminə keçid → İR təlim və kommunikasiya planı qurur, müqaviməti azaldır.</li></ul>`+vs(`<p>İR yalnız «sənəd şöbəsi»dir. Rəhbər plan qurandan sonra xəbər tutur.</p>`,`<p>İR planlaşdırma mərhələsində masadadır, rəqəmlə danışır və riski əvvəlcədən göstərir.</p>`)],
['Bazar','Azərbaycan İR mühiti: kim kimdir?',`<ul><li><b>ƏMAS:</b> əmək siyasəti, əmək müqavilələrinin elektron qeydiyyatı və məşğulluq məsələləri.</li><li><b>Vergilər Nazirliyi / DSMF:</b> gəlir vergisi, sosial sığorta haqları, hesabatlar.</li><li><b>Əmək Məcəlləsi:</b> müqavilə, iş vaxtı, məzuniyyət, xitam, intizam.</li><li><b>Platformalar:</b> boss.az, jobsearch.az, hellojob.az, LinkedIn, universitet karyera mərkəzləri.</li><li><b>Alətlər:</b> Excel, 1C, ERP, daha böyük şirkətlərdə HRIS.</li></ul><p class="tip">Mini-nümunə: Bakıda 50 işçili logistika şirkəti. İR meneceri 1 nəfərdir. Onun işi eyni anda müqavilə hazırlamaq, vakansiya yerləşdirmək, maaş cədvəlini yoxlamaq, işçi şikayətlərinə baxmaq və illik təlim planını qurmaqdır. Buna görə prioritetləşdirmə İR-in ən mühüm bacarığıdır.</p>`],
['Analiz','Vəziyyət analizi: 5 ayrılma',`<p><b>Hadisə:</b> 3 ayda eyni rəhbərin komandasından 5 işçi ayrılıb.</p>`+bars([['Ayrılan işçi',5],['Ortalama komanda',12],['Dövriyyə %',42]])+`<p>Komanda 12 nəfərdirsə, 3 ayda 5 ayrılma təxminən 42% deməkdir. Bu, normal axın yox, <b>siqnaldır</b>.</p><p><b>İR-in düzgün ardıcıllığı:</b> 1) faktları topla (exit interview, ayrılma tarixləri); 2) hipotezlər qur (rəhbərlik üslubu, iş yükü, maaş, inkişaf); 3) rəhbərlə sənədləşmiş söhbət; 4) tədbir (rəhbər üçün koçinq, iş yükü bölgüsü); 5) 3 ay sonra yenidən ölç.</p>`+vs(`<p>Hamının maaşını artırmaq və ya yeni işçi tapıb problemi gizlətmək.</p>`,`<p>Əvvəlcə səbəbi sübutla müəyyən etmək, sonra məqsədli tədbir görmək.</p>`)+`<p class="mut">Qısa xülasə: İR = insan + bacarıq + sistem + qanuni çərçivə + ölçü.</p>`]
];

['Rəqəmlər','İşə qəbul qıfı: niyə 100 müraciətdən 2 nəfər işə başlayır?',`<p>İşə qəbul satış qıfına bənzəyir. Hər mərhələdə insanlar azalır. Peşəkar İR hər mərhələnin keçid faizini izləyir.</p>`+bars([['Müraciət',100],['İlkin seçim',40],['Müsahibə',12],['Təklif',3],['İşə başlayan',2]])+`<p>Bu nümunədə CV-dən müsahibəyə keçid <b>12%</b>-dir. Əgər təkliflərin çoxu rədd edilirsə, problem maaşda və ya prosesin yavaşlığında ola bilər. Əgər müraciət çoxdur, amma uyğun yoxdursa, elan düzgün yazılmayıb.</p>`],
['Addımlar','Prosesi addım-addım qurmaq',`<p>Heç bir mərhələni atlamayın:</p>`+flow(['Ehtiyac','Vəzifə təlimatı','Elan','CV seçimi','Müsahibə','Təklif'])+`<p><b>Vəzifə təlimatı (JD)</b> tərkibi: vəzifənin məqsədi, əsas məsuliyyətlər (5-7), tələb olunan bilik və bacarıqlar, ölçü göstəriciləri (KPI), rəhbər və tabeçilik, əmək haqqı vilkəsi.</p><p class="tip">Qızıl qayda: «lazım olan» və «arzu olunan» tələbləri ayırın. 10 məcburi şərt qoysanız, yaxşı namizədlərin çoxunu itirərsiniz.</p>`],
['Elan','Vakansiya elanı: səhv və düzgün',`<p>Elan həm marketinq, həm hüquqi sənəddir. Eyni vəzifə üçün iki elan:</p>`+vs(`<p>«Satış meneceri lazımdır. 25-30 yaş, enerjili, Bakı sakini. Maaş razılaşma ilə.»</p>`,`<p>«Satış meneceri (B2B). Məsuliyyət: aylıq 15 yeni müştəri. Tələb: 2 il satış təcrübəsi. Təklif: 1200-1800 AZN, bonus, sığorta.»</p>`)+`<p>Səhv elanda <b>yaş</b> məhdudiyyəti ayrı-seçkilik riskidir və «enerjili» ölçülə bilmir. Düzgün elan aydın gözlənti və maaş vilkəsi verir, nəticədə uyğun namizəd çoxalır.</p>`],
['Müsahibə','STAR: yaxşı davranış cavabı necə olur?',`<p>Davranış sualı keçmiş təcrübədən soruşur: «Çətin müştərini necə idarə etmisiniz?» Güclü cavab 4 hissədən ibarətdir:</p>`+flow(['Situasiya','Tapşırıq','Fəaliyyət','Nəticə'])+`<p><b>Nümunə cavab:</b> «Müştəri ödəniş gecikməsinə görə müqaviləni ləğv etmək istəyirdi (S). Hesabı 2 gündə həll etməli idim (T). Mühasibatla əlaqə saxlayıb yazılı plan göndərdim və hər gün zəng etdim (F). Müştəri qaldı, növbəti rübdə 20% sifariş artırdı (N).»</p><table><tr><td><b>Bal</b></td><td><b>Meyar</b></td></tr><tr><td>1-2</td><td>Ümumi danışır, öz rolunu göstərmir</td></tr><tr><td>3</td><td>Fəaliyyət var, nəticə qeyri-dəqiq</td></tr><tr><td>4-5</td><td>Konkret rəqəm, öz töhfəsi, öyrənilən dərs</td></tr></table>`],
['Qərar','Təklif, referans və metriklər',`<p><b>Seçim qərarı:</b> bütün müsahibəçilər meyarlar üzrə ayrıca bal verir, sonra müzakirə edilir. Referans yoxlaması namizədin razılığı ilə aparılır.</p><p><b>Təklif məktubu:</b> vəzifə, əmək haqqı, başlama tarixi, sınaq müddəti, iş rejimi, cavab müddəti.</p><p><b>Hesablama nümunəsi:</b> ümumi işə qəbul xərci 1200 AZN, 4 nəfər işə götürülüb → <code>cost-per-hire = 1200 ÷ 4 = 300 AZN</code>. 4 təklifdən 3-ü qəbul edilib → offer acceptance <code>3 ÷ 4 = 75%</code>. Elanla başlanğıc arasında 30 gün keçibsə → time-to-hire 30 gündür.</p><p class="tip">Excel: <code>=B2/C2</code> (cost-per-hire), <code>=D2/E2</code> (qəbul faizi). Şəxsi məlumatları (CV, əlaqə) yalnız işə qəbul məqsədi ilə və məhdud saxlayın.</p>`]
];
function calc(e){var v=parseFloat(e.value)||0,a=v<=200?v*.03:6+(v-200)*.1,r=v<=200?v*.22:44+(v-200)*.15,t=Math.max(0,Math.min(v,2500)-200)*.14,n=v-a-t;document.getElementById('co').innerHTML='DSMF işçi: <b>'+a.toFixed(2)+'</b><br>DSMF işəgötürən: <b>'+r.toFixed(2)+'</b><br>Gəlir vergisi (≤2500): <b>'+t.toFixed(2)+'</b><br>Təxmini net (tibbi/işsizlik sığortası nəzərə alınmadan): <b>'+n.toFixed(2)+'</b><br>İşəgötürənin ümumi xərci: <b>'+(v+r).toFixed(2)+'</b>'}
M[4].x=0;
M[3].L=[
['Sıfırdan','Əmək hüququ nədir? Bütün sistemin xəritəsi',`<p><b>Əmək münasibəti</b> — bir şəxsin (işçi) başqasının (işəgötürən) tapşırığı ilə, əvəzində əmək haqqı alaraq işləməsidir. Bənzətmə: kirayə müqaviləsi kimidir, amma «kirayə verilən» insanın vaxtı və sağlamlığıdır. Ona görə dövlət işçini <b>zəif tərəf</b> sayır və minimum qaydaları qanunla qoyur.</p><p>Sənədlərin <b>güc sırası</b> var. Aşağıdakı sənəd yuxarıdakından işçinin vəziyyətini pisləşdirə bilməz:</p>`+flow(['Konstitusiya','Əmək Məcəlləsi','Digər qanunlar','Daxili qaydalar','Əmək müqaviləsi','Vəzifə təlimatı'])+`<p><b>Qlobal baxış:</b> Beynəlxalq Əmək Təşkilatı (ILO) bütün ölkələr üçün baza standartlar yaradır: məcburi əməyin qadağası, ayrı-seçkiliyin qadağası, təhlükəsiz iş. Azərbaycan ILO üzvüdür və milli qanunvericilik bu prinsiplərə əsaslanır.</p><p class='tip'><b>Praktika:</b> İşəgötürən daxili qaydalarda «məzuniyyət 14 gündür» yazsa, bu etibarsızdır, çünki qanun əsas məzuniyyətə daha yüksək minimum qoyur. Həmişə soruşun: «Bu qayda qanundan geri çəkilirmi?»</p>`],
['Müqavilə','Əmək müqaviləsi: tərtib və yoxlama',`<p><b>Nədir:</b> işçi ilə işəgötürən arasında yazılı razılaşma. İki nüsxədə tərtib olunur: biri işçidə, biri işəgötürəndə qalır. Müqavilə <b>müddətsiz</b> və ya <b>müddətli</b> (tərəflərin razılaşdığı müddətə, qanundakı məhdudiyyətlərlə) bağlana bilər və ƏMAS-ın elektron sistemində qeydə alınır.</p><p><b>Mütləq elementlər:</b> tərəflər, iş yeri, əmək funksiyası (vəzifə), başlama tarixi, əmək haqqı, iş rejimi, sınaq müddəti (varsa), məzuniyyət.</p>`+vs(`<p>«Sabahdan çıx, maaşı sonra danışarıq.» Şifahi razılaşma, qeydiyyatsız iş.</p>`,`<p>İş günü başlamazdan əvvəl yazılı müqavilə, əmr, qeydiyyat və təlimat imzalanır.</p>`)+`<p><b>Qlobal:</b> ABŞ-da çox yerdə «at-will» (istənilən vaxt, əsas göstərmədən xitam) modeli var, ona görə müqavilə qısa olur. Avropa və Azərbaycan modelində isə xitam üçün <b>əsas və prosedur</b> lazımdır, ona görə müqavilənin dəqiqliyi vacibdir.</p><p class='tip'><b>Yoxlama siyahısı:</b> ad və soyad, FİN, vəzifə, maaş (qros), iş saatları, sınaq müddəti, imza tarixi, iki nüsxə, elektron qeydiyyat, əmr №.</p>`],
['İş vaxtı','İş vaxtı, istirahət və artıq iş',`<p>Azərbaycanda normal iş vaxtı həftədə <b>40 saatdan</b> artıq olmur (gündə 8 saat, 5 günlük həftə). Gecə işi (22:00-06:00), bayram günü və əlavə iş <b>artırılmış ödənişlə</b> və qanuni qaydada tətbiq olunur.</p>`+bars([['Azərbaycan norma',40],['ABŞ overtime həddi',40],['AB orta maksimum',48]])+`<p><b>Qlobal müqayisə:</b> Avropa İttifaqının İş Vaxtı Direktivi həftəlik orta maksimumu (əlavə iş daxil) 48 saat edir. ABŞ-da federal qanun 40 saatdan sonrakı işi adətən 1,5 qat ödənişlə tələb edir (bəzi işçi kateqoriyaları istisnadır).</p><p class='tip'><b>Praktika (tabel):</b> İşçi bir həftədə 5 gün × 9 saat işləyib = 45 saat. Normadan <b>5 saat</b> artıqdır. İR bunu yazılı əmrlə, razılıqla və qanuni ödənişlə rəsmiləşdirməlidir. Excel: <code>=MAX(0;SUM(B2:F2)-40)</code>.</p>`],
['Məzuniyyət','Məzuniyyət: hüquq və hesablama',`<p>Əsas məzuniyyət ildə ən azı <b>21 təqvim günüdür</b>. Staj, zərərli şərait və qanunda göstərilən digər hallar üçün <b>əlavə</b> məzuniyyətlər nəzərdə tutulur. Məzuniyyət ödənişi orta gündəlik əmək haqqından hesablanır.</p><p><b>Öyrənmə nümunəsi (sadələşdirilmiş):</b> son 12 ayın əmək haqqı cəmi 12 000 AZN. Orta aylıq = 1000. Təxmini orta gündəlik = 1000 ÷ 30,4 ≈ 32,89. 21 gün × 32,89 ≈ <b>690,7 AZN</b>.</p><p>Excel: <code>=ROUND(SUM(B2:B13)/12/30,4*21;2)</code></p><p><b>Qlobal:</b> Avropa İttifaqında qanuni minimum ən azı 4 ödənişli iş həftəsidir. ABŞ federal qanunu ödənişli məzuniyyəti məcburi etmir, şirkətlər öz siyasətini qurur.</p><p class='tip'>Məzuniyyət cədvəli ilin əvvəlində hazırlanır. İR kritik komandalarda eyni vaxta düşən məzuniyyətləri balanslaşdırır. Dəqiq hesablama qaydasını e-qanun.az-da yoxlayın.</p>`],
['Xitam','İşə xitam və ixtisar',`<p><b>Xitam yolları:</b> tərəflərin razılığı; işçinin təşəbbüsü (1 ay əvvəl xəbərdarlıq); müddətin bitməsi; işəgötürənin təşəbbüsü (yalnız qanunda sadalanan əsaslarla, məsələn, ştat ixtisarı, uyğunsuzluq, intizam pozuntusu).</p><p><b>İxtisar prosesi:</b></p>`+flow(['Əsaslandırma','Ştat dəyişikliyi','Xəbərdarlıq','Müavinət','Əmr','Yekun hesab'])+`<p>Hamilə qadınlar və qanunda göstərilən digər qrupların xitamdan qorunması xüsusi qaydalara tabedir. Yekun hesablaşmaya əmək haqqı, istifadə olunmamış məzuniyyət kompensasiyası və qanuni müavinətlər daxildir.</p><p><b>Qlobal:</b> ILO-nun 158 nömrəli Konvensiyası xitam üçün <b>əsaslı səbəb</b> tələb edir. ABŞ-da isə «at-will» qaydası geniş yayılıb. Beynəlxalq şirkətin Azərbaycan filialında mərkəz «sadəcə çıxar» desə də, yerli qanun prosedur tələb edir.</p>`],
['Case','İntizam: gecikən işçi',`<p><b>Hadisə:</b> İşçi bir ayda 4 dəfə 40 dəqiqə gecikib. Rəhbər «çıxarın» deyir. İR nə etməlidir?</p>`+flow(['Faktı yaz','Yazılı izahat','Qiymətləndir','Tədbir','Əmr','İmza'])+vs(`<p>Gecikmə üçün dərhal işdən azad etmək, izahat almamaq.</p>`,`<p>Tabel qeydi, işçidən yazılı izahat, qanuni intizam tədbiri, əmr və tanışlıq imzası.</p>`)+`<p><b>Niyə?</b> Yazılı izahat və sənədlər olmasa, mübahisə məhkəməyə düşərsə, işəgötürən proseduru sübut edə bilməz. İR rəhbərin tələbi ilə hüquqi risk arasında körpüdür.</p><p class='tip'>Qısa xülasə: <b>qanun → müqavilə → qayda → sənəd → prosedur</b>. Hər addımı yazıya alın.</p>`]
];
M[4].L=[
['Sıfırdan','Gross, net və kim nə ödəyir?',`<p><b>Gross (qros)</b> — müqavilədə yazılan əmək haqqıdır. <b>Net</b> — vergi və sığorta tutulduqdan sonra işçinin əlinə keçən məbləğ. Bənzətmə: restoran hesabı. Yeməyin qiyməti gross, xidmət haqqı və vergilər üstünə gəlir.</p><p>İki tərəf ödəyir: <b>işçi</b> (gəlir vergisi, işçi DSMF, tibbi/işsizlik sığortası) və <b>işəgötürən</b> (işəgötürən DSMF və s., maaşın üstündən əlavə xərc kimi).</p>`+flow(['Qros maaş','İşçi tutulmaları','Net maaş','İşəgötürən payı','Ümumi xərc','Hesabat'])+`<p class='tip'>Praktika: 1000 AZN qros. İşçi bunu 1000 kimi görmür, işəgötürən isə 1000-dən çox xərcləyir. İR namizədə düzgün izah etməlidir: «net deyirsiniz, yoxsa qros?»</p>`],
['DSMF','Sosial sığorta: nədir və niyə var?',`<p><b>DSMF</b> (Dövlət Sosial Müdafiə Fondu) pensiya, müavinət və sosial sığorta ödənişlərini maliyyələşdirir. İşçi və işəgötürən hər ay maaşdan faiz ödəyir.</p><p><b>Qeyri-neft qeyri-dövlət sektoru üçün (2026, vergilər nazirliyi məlumatı):</b></p><ul><li><b>İşçi:</b> 200 AZN-ə qədər 3%; 200-dən yuxarı: 6 AZN + 200-dən çox hissənin 10%.</li><li><b>İşəgötürən:</b> 200 AZN-ə qədər 22%; 200-dən yuxarı: 44 AZN + 200-dən çox hissənin 15% (8000 AZN-ə qədər).</li></ul><p><b>Misal (1000 AZN qros):</b> işçi = 6 + 800×10% = <b>86</b>; işəgötürən = 44 + 800×15% = <b>164</b>.</p>`+bars([['İşçi DSMF',86],['İşəgötürən DSMF',164]])+`<p><b>Qlobal:</b> hər ölkədə oxşar sistem var: ABŞ-da Social Security, Almaniyada pensiya sığortası, Böyük Britaniyada National Insurance. Fərq dərəcə və bölgüdədir.</p>`],
['Vergi','Gəlir vergisi və kalkulyator',`<p>Əsas iş yerində aylıq <b>ilk 200 AZN gəlir vergisindən azaddır</b>, 2500 AZN-ə qədər qalan hissəyə <b>14%</b> tətbiq olunur. Misal: 600 AZN maaş → (600−200)×14% = <b>56 AZN</b>. 2500 AZN-dən yuxarı hissələr üçün xüsusi dərəcələr var.</p><p><b>Qlobal:</b> əksər ölkələrdə vergi <b>proqressivdir</b> (gəlir artdıqca dərəcə artır). Bəzi ölkələrdə sabit (flat) vergi var. Azərbaycanda qaydalar son illər dəyişib, ona görə rəsmi saytı yoxlamaq vacibdir.</p><div class='card'><b>Kalkulyator</b> (qros AZN, yalnız öyrənmə üçün)<input type='number' id='gr' placeholder='məs. 1000' oninput='calc(this)'><div id='co' class='mut'></div></div><p class='tip'>Kalkulyator tibbi və işsizlik sığortasını daxil etmir və 2500-dən yuxarı dərəcəni göstərmir. Rəsmi hesab üçün taxes.gov.az və mühasibata baxın.</p>`],
['Minimum','Minimum maaş, sığortalar, bonus və ümumi xərc',`<p><b>Minimum əmək haqqı</b> 400 AZN-dir (2025-ci ildən). Qanuna əsasən ona ildə ən azı bir dəfə baxılır, ona görə hər il yoxlayın.</p><p><b>Digər ödənişlər:</b> icbari tibbi sığorta və işsizlik sığortası (işçi və işəgötürən payı, faizlər qanunla müəyyən olunur). <b>Bonuslar</b> vergi və sığorta bazasına düşə bilər, mühasibatla razılaşdırın.</p><p><b>İşəgötürənin ümumi xərci:</b> qros + işəgötürən DSMF + digər sığortalar. 1000 qros üçün ən azı <b>1164 AZN</b> (yalnız DSMF ilə).</p>`+vs(`<p>«Maaş büdcəsi = qros maaşların cəmi.» Büdcə kəsir verir.</p>`,`<p>Büdcə = qros + işəgötürən payları + bonus + məzuniyyət ehtiyatı + təlim.</p>`)],
['Excel','Excel-də maaş cədvəli: addım-addım',`<p>A: Ad | B: Qros | C: DSMF işçi | D: Gəlir vergisi | E: Net (təxmini) | F: DSMF işəgötürən | G: Ümumi xərc</p><ul><li><code>C2: =IF(B2&lt;=200;B2*3%;6+(B2-200)*10%)</code></li><li><code>D2: =MAX(0;MIN(B2;2500)-200)*14%</code></li><li><code>E2: =B2-C2-D2</code></li><li><code>F2: =IF(B2&lt;=200;B2*22%;44+(B2-200)*15%)</code></li><li><code>G2: =B2+F2</code></li><li>Cəm: <code>=SUM(B2:B51)</code> və PivotTable ilə şöbə üzrə xərc.</li></ul><p><b>Qaydalar:</b> faizləri ayrıca «Parametrlər» səhifəsinə yazın (dərəcə dəyişəndə düsturlar yenilənsin). Data Validation ilə mənfi maaşın qarşısını alın. Faylı şifrələyin, maaşlar məxfidir.</p><p><b>Global alətlər:</b> böyük şirkətlər payroll üçün SAP, Workday, ADP, Oracle istifadə edir. Azərbaycanda kiçik şirkətlər Excel + 1C ilə başlayır.</p>`],
['Case','Praktik tapşırıq: 1800 AZN maaş',`<p>İşçinin qros maaşı 1800 AZN-dir.</p><ul><li>İşçi DSMF = 6 + 1600×10% = <b>166</b></li><li>İşəgötürən DSMF = 44 + 1600×15% = <b>284</b></li><li>Gəlir vergisi = (1800−200)×14% = <b>224</b></li><li>İşəgötürənin ümumi xərci ≥ 1800 + 284 = <b>2084</b></li></ul>`+vs(`<p>1800 × 14% hesablamaq, 200 azadolmanı unutmaq.</p>`,`<p>Əvvəl azadolmanı çıxmaq, sonra dərəcəni tətbiq etmək. Parametrləri ayrı yazmaq.</p>`)+`<p class='tip'>Həmişə yoxlayın: <b>dərəcələr, azadolmalar, tarixlər</b>. Qanun dəyişəndə köhnə cədvəl yanlış maaş çıxarar.</p>`]
];
M[2].s=0;M[2].L=[
['Sıfırdan','Adaptasiya nədir və niyə birinci aylar həlledicidir?',`<p><b>Adaptasiya (onboarding)</b> yeni işçinin işə, komandaya və şirkət mədəniyyətinə uyğunlaşmasını sürətləndirən prosesdir. Bənzətmə: yeni şəhərə köçəndə xəritə, açar və tanış lazımdır, yoxsa itərsiniz. SHRM və Gallup kimi qurumların araşdırmaları göstərir ki, zəif adaptasiya işçilərin ilk aylarda ayrılmasının əsas səbəblərindəndir.</p>`+flow(['Pre-boarding','1-ci gün','1-ci həftə','30 gün','60 gün','90 gün'])+`<p><b>Qlobal model (Bauer 4C):</b> <b>Compliance</b> (qaydalar, sənədlər), <b>Clarification</b> (rolun aydınlığı), <b>Culture</b> (dəyərlər), <b>Connection</b> (insan əlaqələri). Çox şirkət yalnız birincini edir, qalanı əhəmiyyətli qalır.</p><p class='tip'>Praktika: sizcə yeni işçi ilk gün nəyi ən çox xatırlayır, sənəd imzalamağı, yoxsa onu kimin qarşıladığını?</p>`],
['Checklist','Pre-boarding və birinci gün: praktiki siyahı',`<p><b>İşə başlamazdan əvvəl:</b> təklif qəbul olunub, müqavilə və əmr hazır, qeydiyyat edilib, iş yeri, kompüter, e-poçt və hesablar, giriş kartı, mentor təyin olunub, komandaya xəbər verilib, salamlama məktubu göndərilib.</p><p><b>Birinci gün:</b> qarşılama, ofis turu, komanda ilə tanışlıq, iş təhlükəsizliyi təlimatı (imza ilə), əsas siyasətlər, ilk həftənin planı, mentorla nahar.</p>`+vs(`<p>Yeni işçi gəlir, kompüter yoxdur, rəhbər görüşdədir, heç kim tanıtmır. 2-ci gün hamı unudur.</p>`,`<p>Hazır iş yeri, rəhbərin salamlaması, mentor, gün planı və ilk həftə üçün 3 konkret məqsəd.</p>`)+`<p class='tip'>Excel: yeni işçilər üçün izləmə cədvəli açın (Ad, Başlama tarixi, Mentor, Checklist faizi). Faiz: <code>=COUNTIF(C2:N2;"✓")/12</code>.</p>`],
['30-60-90','30-60-90 planı və sınaq müddəti',`<ul><li><b>İlk 30 gün (öyrənmə):</b> proseslər, sistemlər, komanda, 2 kiçik tapşırıq.</li><li><b>60 gün (töhfə):</b> müstəqil tapşırıqlar, ara rəy görüşü, çatışmazlıqların müəyyənləşməsi.</li><li><b>90 gün (məsuliyyət):</b> tam məsuliyyət, yekun rəy, sınaq müddətinin nəticəsi.</li></ul><p>Azərbaycanda əmək müqaviləsində sınaq müddəti şərt qoyula bilər (ümumi halda 3 ayadək). Bu müddətdə də işçinin əmək haqqı, sosial sığorta və digər hüquqları qüvvədədir. Sınaq müddətinin nəticəsini rəhbər sənədləşdirməlidir: gözlənti, rəy, nəticə.</p><p><b>Qlobal praktika:</b> Amazon, Google kimi şirkətlər yeni işçiyə «buddy» (dost-mentor) təyin edir və ilk həftə üçün hazır plan verir. Bunu kiçik şirkətdə də etmək olar.</p>`],
['Case','Case: üçüncü həftədə susqun yeni menecer',`<p><b>Hadisə:</b> Yeni satış meneceri 3 həftədir toplantılarda susur, sual vermir, ilk satış yoxdur.</p>`+flow(['Fakt topla','Söhbət','Səbəb tap','Plan','Dəstək','Təkrar ölç'])+`<p><b>İR-in sualları:</b> rolun aydınlığı varmı? Mentor kömək edirmi? Sistemə giriş problemi varmı? Məqsədlər real idimi? Çox vaxt problem insanda yox, <b>prosesdə</b> olur.</p><p><b>Adaptasiya KPI-ləri:</b> 90 günlük saxlanma, məhsuldarlığa çatma müddəti (time-to-productivity), yeni işçi məmnuniyyəti (1-5), checklist tamamlanma faizi.</p><p class='tip'>Qısa xülasə: <b>hazırlıq → anlaşılan rol → əlaqə → ölçülən məqsəd → rəy.</b></p>`]
];
M[5].L=[
['Sıfırdan','Kadr sənədləri: nə, niyə və necə saxlanır?',`<p>Kadr sənədləri işçi ilə şirkət arasındakı hüquqi münasibətin <b>sübutudur</b>. Mübahisə olsa, ilk soruşulan sənəddir.</p>`+flow(['Müqavilə','Qəbul əmri','Şəxsi iş','Tabel','Məzuniyyət','Arxiv'])+`<ul><li><b>Şəxsi iş:</b> sənədlər, ərizə, əmrlər, təhsil sənədi, imzalı təlimatlar.</li><li><b>Tabel:</b> iş vaxtı uçotu, əlavə iş və məzuniyyət qeydi.</li><li><b>Əmrlər:</b> qəbul, köçürmə, məzuniyyət, intizam, xitam.</li></ul><p><b>Məlumat qorunması:</b> işçi məlumatları fərdi məlumatdır. Azərbaycanın «Fərdi məlumatlar haqqında» qanunu və qlobal GDPR prinsipləri oxşardır: yalnız lazım olanı topla, məqsədə uyğun istifadə et, məhdud saxla, icazəsiz paylaşma.</p><p class='tip'>Praktika: şəxsi işi açıq rəfdə yox, kilidli şkafda və ya hüquqlu şəxslərə açıq sistemdə saxlayın.</p>`],
['Excel','Excel-də İR bazası: addım-addım',`<p><b>Sütunlar:</b> Ad, FİN, Şöbə, Vəzifə, Başlama tarixi, Müqavilə bitmə tarixi, Qros maaş, Status.</p><ul><li>Staj (il): <code>=DATEDIF(E2;TODAY();"Y")</code></li><li>Şöbədə say: <code>=COUNTIFS(C:C;"Satış";H:H;"Aktiv")</code></li><li>Maaşı vəzifəyə görə tapmaq: <code>=XLOOKUP("Menecer";D:D;G:G)</code></li><li>Müqavilənin bitməsinə qalan gün: <code>=F2-TODAY()</code></li></ul><p>Conditional Formatting: qalan gün 30-dan azdırsa sarı, 0-dan azdırsa qırmızı rəng. Data Validation: Status sütununu siyahıdan seçməklə doldurun (Aktiv, Məzuniyyət, Ayrılıb).</p><p><b>PivotTable:</b> bazanı seçin, Insert → PivotTable, Şöbəni sətrə, Qros maaşı dəyərə (Average) qoyun. 10 saniyədə şöbə üzrə orta maaş.</p>`],
['Sistemlər','HRIS, ATS, payroll: qlobal və yerli',`<ul><li><b>HRIS</b> (kadr bazası): BambooHR, Workday, SAP SuccessFactors, Oracle HCM.</li><li><b>ATS</b> (işə qəbul): Greenhouse, Lever, Recruitee.</li><li><b>Payroll</b> (əmək haqqı): ADP, SAP, yerli şirkətlər üçün 1C və mühasibat proqramları.</li><li><b>LMS</b> (təlim): Moodle, Coursera for Business, LinkedIn Learning.</li><li><b>Analitika:</b> Excel, Power BI, Tableau.</li></ul>`+vs(`<p>Bahalı sistem alıb prosesləri təyin etməmək. Sistem səhv prosesi sürətləndirir.</p>`,`<p>Əvvəlcə prosesi və məlumat sahələrini yazmaq, sonra uyğun aləti seçmək.</p>`)+`<p class='tip'>Seçim meyarları: istifadə rahatlığı, azərbaycan dili və yerli qanunla uyğunluq, ixrac imkanı (Excel/CSV), təhlükəsizlik, qiymət.</p>`],
['Case','Case: 50 işçilik şirkət üçün İR bazası',`<p>Şirkətdə məlumat 3 ayrı Excel faylındadır, bəzi sətirlər köhnədir.</p>`+flow(['Fayllar toplan','Sütunlar standart','Təmizlə','Düstur əlavə et','Hesabat','Qoruma'])+`<p><b>Təmizlik qaydaları:</b> tarix formatı vahid, şöbə adları siyahıdan, təkrar sətirlər yoxdur, hər işçinin yalnız bir qeydi var.</p><p><b>3 faydalı hesabat:</b> şöbə üzrə say və orta maaş; 30 gün ərzində bitən müqavilələr; aylıq giriş-çıxış (turnover).</p><p class='tip'>Faylı parolla qoruyun, yalnız İR və səlahiyyətli şəxslər açsın, ehtiyat nüsxəsi (backup) saxlayın.</p>`]
];
M[6].s=0;M[6].L=[
['Sıfırdan','Metrik, KPI, məqsəd: fərq nədir?',`<p><b>Metrik</b> — ölçülən istənilən rəqəm. <b>KPI</b> — məqsədlə bağlı əsas göstərici. Bənzətmə: avtomobil panelində sürət əsas göstəricidir, radionun səs səviyyəsi isə sadəcə metrikdir.</p><p><b>Əvvəl-göstərici (leading)</b> gələcəyi göstərir (həftəlik zəng sayı). <b>Sonra-göstərici (lagging)</b> nəticəni göstərir (rüblük satış). İkisi birlikdə lazımdır.</p>`+bars([['Həftəlik zəng',60],['Görüş',30],['Təklif',15],['Satış',6]])+`<p>Satış (sonra-göstərici) artmırsa, əvvəl-göstəricilərə baxırıq: zəng, görüş, təklif. Beləliklə problemi erkən tapırıq.</p>`],
['SMART/OKR','SMART, OKR və Balanced Scorecard',`<p><b>SMART:</b> Specific, Measurable, Achievable, Relevant, Time-bound. «Yaxşı işləmək» məqsəd deyil, «Növbəti rübdə müştəri şikayətlərini 20% azaltmaq» məqsəddir.</p><p><b>OKR</b> (John Doerr, «Measure What Matters»; Google istifadə edir): <b>Objective</b> (ilhamverici məqsəd) + 3-5 <b>Key Results</b> (ölçülən nəticə).</p><p><i>Nümunə:</i> O: «İR xidmətini sürətli etmək». KR1: time-to-hire 45 gündən 30 günə. KR2: yeni işçi məmnuniyyəti 4,5/5. KR3: 90 günlük saxlanma 90%.</p><p><b>Balanced Scorecard</b> (Kaplan–Norton): maliyyə, müştəri, daxili proses, öyrənmə və inkişaf perspektivləri.</p>`+vs(`<p>10 KPI seçmək, heç birinə sahib təyin etməmək.</p>`,`<p>3-5 KPI, hər birinin sahibi, ölçü tezliyi və hədəf rəqəmi.</p>`)],
['İR KPI','İR göstəriciləri və hesablama',`<ul><li><b>İşçi dövriyyəsi</b> = ayrılanlar ÷ orta say × 100. Misal: ay başı 100, ay sonu 96, ayrılan 6 → orta 98 → <b>6,1%</b>.</li><li><b>Time-to-fill</b> = vakansiya açıldığı gündən təklif qəbuluna qədər gün.</li><li><b>Davamsızlıq</b> = itirilmiş gün ÷ planlı gün × 100.</li><li><b>eNPS</b> = tövsiyə edənlərin % − tövsiyə etməyənlərin %. Misal: 50% − 20% = <b>+30</b>.</li><li><b>Saxlanma</b> = 1 il sonra qalanlar ÷ ilkin say.</li></ul><p>Excel: <code>=B2/AVERAGE(C2:D2)</code> (dövriyyə). İllik dövriyyə üçün 12 ayın ayrılanlarını cəmləyib orta sayına bölün.</p><p class='tip'>Qlobal standart ISO 30414 İR göstəricilərini hesabatlılıq üçün sistemləşdirir (dövriyyə, təlim xərci, məhsuldarlıq).</p>`],
['Qiymətləndirmə','Performans qiymətləndirmə və rəy',`<p><b>Üsullar:</b> məqsədlərə görə (KPI/OKR), 360° rəy, 9-box, rüblük rəy görüşü. <b>9-box:</b> performans (aşağı-orta-yüksək) × potensial (aşağı-orta-yüksək).</p><p><b>SBI rəy modeli</b> (Center for Creative Leadership): <b>Situasiya</b> (nə vaxt, harada) → <b>Davranış</b> (nə etdi) → <b>Təsir</b> (nəticə).</p>`+vs(`<p>«Sən məsuliyyətsizsən.» Qiymət və şəxsiyyətə hücum.</p>`,`<p>«Dünən müştəri görüşünə 15 dəqiqə gecikdin (S, D), müştəri narahat oldu (T). Gələcəkdə mən necə kömək edim?»</p>`)+`<p><b>PIP</b> (Performance Improvement Plan): konkret çatışmazlıq, ölçü, müddət (məsələn, 60 gün), dəstək, görüşlər. Məqsəd işçini düzəltməkdir, sənəd yığmaq yox.</p><p class='tip'>Kalibrasiya görüşü: rəhbərlər qiymətləri müqayisə edir ki, bir rəhbər həddindən artıq tələbkar, digəri həddindən artıq yumşaq olmasın.</p>`]
];
M[7].L=[
['Sıfırdan','Təlim ehtiyacı nədir? TNA və ADDIE',`<p>Hər problem təlim problemi deyil. İşçi proqramı bilmirsə — təlim; motivasiyası yoxdursa — rəhbər və mükafat; proses səhvdirsə — proses düzəlişi. <b>TNA</b> (Training Needs Analysis) bunu ayırır: <b>istənilən performans − faktiki performans = boşluq</b>.</p><p><b>ADDIE modeli</b> (qlobal standart):</p>`+flow(['Analiz','Dizayn','İnkişaf','İcra','Qiymətləndirmə','Təkmilləşdirmə'])+`<p class='tip'>Praktika: 10 satıcının 6-sı CRM-də məlumat daxil etmir. Səbəb: sistemi bilmirlər (təlim), yoxsa çox vaxt aparır (proses)? Sorğu və müşahidə ilə yoxlayın.</p>`],
['Metodlar','İnkişaf metodları: 70-20-10 və daha çoxu',`<ul><li><b>70% iş təcrübəsi:</b> layihə, rotasiya, yeni vəzifə, tapşırıq.</li><li><b>20% başqalarından:</b> mentorluq, coaching, rəy.</li><li><b>10% formal:</b> kurs, seminar, e-öyrənmə.</li></ul><p><b>Mentorluq</b> təcrübəli işçinin tövsiyə verməsidir, <b>coaching</b> isə sualla işçinin özünün həll tapmasına kömək edir. <b>E-öyrənmə:</b> Coursera, LinkedIn Learning, Udemy, Google Career Certificates.</p>`+vs(`<p>Bütün işçiləri eyni 1 günlük seminara göndərmək, nəticəni ölçməmək.</p>`,`<p>Ehtiyaca görə qrup seçmək, təlimdən sonra rəhbərlə tətbiq planı və 30-60 gün sonra yoxlama.</p>`)],
['Ölçmə','Təlimin effektivliyi: Kirkpatrick və ROI',`<ul><li><b>1. Reaksiya:</b> məmnunluq anketi.</li><li><b>2. Öyrənmə:</b> test, praktik tapşırıq.</li><li><b>3. Davranış:</b> işdə tətbiq (rəhbər müşahidəsi).</li><li><b>4. Nəticə:</b> biznes göstəricisi (satış, şikayət, xəta).</li></ul><p><b>ROI nümunəsi:</b> təlim xərci 2000 AZN. Nəticədə şikayətlərin azalması ilə 3500 AZN qənaət. <code>ROI = (3500−2000) ÷ 2000 = 75%</code>.</p><p>Excel: <code>=(B2-C2)/C2</code>. Nəticələri ayrı «səbəb» və «təsadüf» baxımından yoxlayın: eyni dövrdə başqa faktor dəyişibsə, bütün effekti təlimə aid etmək olmaz.</p><p class='tip'>Qlobal praktika: Phillips ROI modeli Kirkpatrick-ə 5-ci səviyyə (ROI) əlavə edir.</p>`],
['Plan','İllik təlim planı və case',`<p><b>İllik plan sütunları:</b> mövzu, hədəf qrup, metod, təlimçi, tarix, büdcə, ölçü göstəricisi.</p><p><b>Case:</b> yeni təyin olunmuş komanda lideri üçün 3 aylıq plan.</p><ul><li><b>1-ci ay:</b> liderlik əsasları (formal), mentor təyini, komandanın hədəflərini yazmaq.</li><li><b>2-ci ay:</b> 1:1 görüşləri, rəy vermək praktikası (SBI), kiçik layihə.</li><li><b>3-cü ay:</b> yekun rəy, KPI müqayisəsi, inkişaf planı.</li></ul><p><b>Ölçmə:</b> komanda məmnuniyyəti, hədəflərin icrası, lider özünü qiymətləndirmə.</p><p class='tip'>Büdcə qaydası: ümumi maaş fondunun müəyyən faizi təlimə ayrılır, faizi şirkətdən asılıdır. Əvvəl prioritetləri seçin, sonra büdcəni bölün.</p>`]
];
M[8].L=[
['Sıfırdan','Total rewards: maaş yalnız bir hissədir',`<p><b>Total rewards</b> (ümumi mükafat) maddi və qeyri-maddi hissədən ibarətdir: əsas maaş, bonus, sığorta, nəqliyyat/yemək, təlim, çevik qrafik, tanınma, inkişaf.</p>`+flow(['Əsas maaş','Bonus','Sığorta','İmtiyaz','İnkişaf','Tanınma'])+`<p><b>Nəzəriyyələr:</b> <b>Maslow</b> (ehtiyaclar piramidası), <b>Herzberg</b> (gigiyena amilləri narazılığı azaldır, motivatorlar həvəs yaradır), <b>Adams</b> (ədalət: işçi öz payını başqaları ilə müqayisə edir).</p><p class='tip'>Praktika: işçi eyni işi görən həmkarının daha çox aldığını bilsə, maaş yüksək olsa da narazı olacaq. Ədalət qavrayışı məbləğdən vacibdir.</p>`],
['Grading','Vəzifə qiymətləndirmə və maaş vilkələri',`<p><b>Qayda:</b> vəzifələr qiymətləndirilir (məsuliyyət, bilik, mürəkkəblik; Hay və Mercer metodları qlobal standartdır), sonra qrupa (grade) bölünür, hər qrupa maaş vilkəsi qoyulur.</p><p><b>Nümunə:</b> Grade 3: minimum 900, orta 1200, maksimum 1500 AZN.</p><ul><li>Vilkə genişliyi = (1500−900) ÷ 900 = <b>66,7%</b>.</li><li>Compa-ratio = maaş ÷ orta nöqtə. İşçi 1000 alırsa: 1000 ÷ 1200 = <b>0,83</b> → ortadan 17% aşağıdır.</li></ul><p>Excel: <code>=B2/C2</code>. Compa-ratio 0,8-dən aşağı olanlar ayrılma riski qrupudur.</p>`+vs(`<p>Maaşı şəxsən razılaşma ilə təyin etmək, meyar yoxdur.</p>`,`<p>Vəzifə dəyəri və bazar məlumatı ilə vilkə, sonra təcrübəyə və performansa görə yerləşdirmə.</p>`)],
['Bonus','Bonus, sığorta, şəffaflıq və qlobal tendensiyalar',`<ul><li><b>Bonus növləri:</b> aylıq/rüblük KPI bonusu, illik, layihə, tövsiyə (referral) bonusu.</li><li><b>Azərbaycanda:</b> bonuslar adətən vergi və sosial sığorta bazasına düşür, qaydanı mühasibatla yoxlayın. Könüllü tibbi sığorta, yemək və nəqliyyat kompensasiyası şirkətə rəqabət üstünlüyü verir.</li><li><b>Qlobal:</b> texnologiya şirkətlərində hissə (stock options), çevik iş və uzaqdan iş; Avropa İttifaqının Pay Transparency Directive-i maaş şəffaflığını gücləndirir.</li></ul><p><b>Bazar məlumatı:</b> maaş sorğuları (Mercer, Korn Ferry, PayScale), yerli vakansiya saytlarının maaş vilkələri, rəqiblərlə şəxsi söhbətlər (qanuni çərçivədə).</p><p class='tip'>Qayda: bonus meyarlarını əvvəlcədən yazılı elan edin ki, subyektiv qalmasın.</p>`],
['Case','Case: ən yaxşı işçi gedir',`<p>Yüksək performanslı işçi başqa şirkətin təklifini alıb. Əsas səbəb: tanınma və inkişaf yoxdur.</p>`+flow(['Söhbət','Səbəb','Benchmark','Təklif','Plan','Təqib'])+`<p><b>Düzgün yanaşma:</b> yalnız maaş artırmaq (counter-offer) çox vaxt müvəqqəti həll olur. Herzberg-ə görə motivatorları gücləndirin: yeni məsuliyyət, inkişaf planı, açıq tanınma, aydın karyera yolu. Maaş vilkəsində yerini yoxlayın (compa-ratio).</p>`+vs(`<p>Son gün zəng edib 20% artım vəd etmək, planı olmamaq.</p>`,`<p>Erkən risk siqnalları (compa-ratio, rəy, davamiyyət) ilə hər rübdə «qalma söhbəti» aparmaq.</p>`)],
];
M[9].s=0;M[9].L=[
['Sıfırdan','Şikayət, intizam və xitam prosesi',`<p>Əmək münasibətlərində hər mübahisə üç sualla başlayır: <b>nə baş verib, sübut nədir, qayda nədir?</b> Bu suallara yalnız sənədli proses cavab verir.</p>`+flow(['Şikayət','Qeydiyyat','Araşdırma','Qərar','Əmr','Təqib'])+`<ul><li><b>Qeydiyyat:</b> şikayət yazılı, tarix və imza ilə.</li><li><b>Araşdırma:</b> tərəflərin dinlənilməsi, şahidlər, sənədlər, məxfilik.</li><li><b>Qərar:</b> qanuni və mütənasib tədbir.</li><li><b>Təqib:</b> 30-60 gündən sonra vəziyyətin yoxlanması.</li></ul><p class='tip'>Əsas qayda: araşdırmanı şikayət edilən şəxsin birbaşa rəhbəri tək aparmamalıdır, tərəfsiz iştirakçı olmalıdır.</p>`],
['Təhlükəsizlik','Əmək təhlükəsizliyi (OSH)',`<p>İşəgötürən təhlükəsiz şərait yaratmağa borcludur. <b>Risk = ehtimal × ağırlıq.</b> Beynəlxalq standart ISO 45001 və ILO tövsiyələri əsasdır.</p>`+flow(['Təhlükəni tap','Riski qiymətləndir','Nəzarət et','Təlim ver','Hadisəni yaz','Təhlil et'])+`<p><b>Nəzarət iyerarxiyası:</b> təhlükəni aradan qaldır → əvəz et → mühəndis həlli → inzibati qayda → şəxsi qoruyucu vasitə (sonuncu yol).</p><p>Təlimatlar: giriş, iş yerində, təkrar, planlaşdırılmamış. İşçi hər birini imza ilə təsdiqləyir. Qəza halında hadisə sənədləşdirilir, səbəb təhlil olunur, təkrarlanmaması üçün tədbir görülür.</p>`],
['Mədəniyyət','Mədəniyyət, ayrı-seçkilik və təqib',`<p><b>Mədəniyyət</b> «burada işlər necə görülür» deməkdir. İR dəyərləri sənəddə yox, davranışda göstərir: işə qəbul, mükafat və xitam qərarlarında.</p><ul><li><b>Ayrı-seçkilik:</b> cins, yaş, əlillik, dil, ailə vəziyyəti və s. əsasında fərq qoymaq qadağandır. Bərabər dəyərli işə bərabər haqq prinsipi qlobaldır.</li><li><b>Təqib (harassment):</b> istənilməyən davranış, aşağılama, hədə. Şikayət kanalı və məxfilik olmalıdır.</li><li><b>DEI:</b> müxtəliflik, bərabərlik, inklüzivlik daha yaxşı qərar və bağlılıq gətirir.</li></ul>`+vs(`<p>«Şikayət etmə, problem yaradırsan.» Şikayətin gizlədilməsi.</p>`,`<p>Şikayət kanalı, qisas qadağası, tərəfsiz araşdırma, nəticənin bildirilməsi.</p>`)],
['Yekun','Yekun: İR sistemini bir yerə yığırıq',`<p>İndi bütün modulları bir zəncirə yığaq:</p>`+flow(['Plan','İşə qəbul','Adaptasiya','Performans','Təlim','Mükafat'])+`<p>Hər mərhələnin ölçüsü var: <b>time-to-fill, 90 günlük saxlanma, KPI icrası, təlim ROI, compa-ratio, dövriyyə</b>. Hər mərhələnin qanuni çərçivəsi var: Əmək Məcəlləsi, vergi/DSMF, məlumat qorunması, OSH.</p><p><b>12 aylıq İR planı (şablon):</b> Rüb 1 — sənəd və prosesləri düzəlt; Rüb 2 — işə qəbul və adaptasiya standartı; Rüb 3 — KPI və qiymətləndirmə; Rüb 4 — təlim, kompensasiya revizyası, hesabat.</p><p class='tip'>Son qayda: <b>qanuni, ədalətli, sənədləşdirilmiş və ölçülə bilən.</b> Əsas rəqəm və qanun müddətləri tez dəyişir, rəsmi mənbələri (e-qanun.az, taxes.gov.az, ƏMAS) mütləq yoxlayın.</p>`]

{t:"SMM-ə giriş və strategiya",b:[""],L:[
['Sıfırdan','SMM nədir və SMM mütəxəssisi nə edir?',`<p><b>SMM</b> (Social Media Marketing) sosial şəbəkələrdə brendin tanınması, auditoriya ilə münasibət və satış üçün sistemli işdir. Bənzətmə: mağaza vitrini + satıcı + reklam lövhəsi eyni anda sosial şəbəkədədir.</p>`+flow(['Strategiya','Kontent','İcma','Reklam','Analitika','Hesabat'])+`<p>Azərbaycanda ən çox istifadə olunan platformalar: <b>Instagram, Facebook, TikTok, YouTube, Telegram</b>, B2B üçün <b>LinkedIn</b>. Ünsiyyət çox vaxt WhatsApp və DM vasitəsilə satışa çevrilir.</p><p class='tip'><b>Case:</b> Bakıda kiçik kafe. Məqsəd: həftə sonu doluluğunu artırmaq. SMM işi: hədəf auditoriya (tələbə, ailə), Reels, aksiya, rezervasiya DM-i, kiçik reklam büdcəsi və aylıq nəticə izləmə.</p>`],
['Persona','Auditoriya və persona',`<p>«Hamıya satırıq» strategiyası zəifdir. <b>Persona</b> hədəf müştərinin tipik obrazıdır: yaş, şəhər, gəlir, maraq, problem, hansı platformadan istifadə edir, alış səbəbi, etirazı.</p>`+vs(`<p>«Hədəf auditoriyamız 18-65 yaşlı hamıdır.»</p>`,`<p>«Nərimanov rayonunda 25-34 yaşlı, tez nahar axtaran ofis işçiləri, Instagramda aktiv, qiymət və sürət vacib.»</p>`)+`<p class='tip'><b>Praktika:</b> 3 persona yaz, hər birinə ayrı mesaj hazırla. Kontent və reklam məhz o şəxsin dilində olmalıdır. Mövcud müştərilərlə qısa söhbət ən yaxşı araşdırmadır.</p>`],
['Funnel','Məqsəd və satış qıfı',`<p>Müştəri qərar yolu: <b>Tanınma → Maraq → Qərar → Alış → Loyallıq</b>. Hər mərhələnin kontenti və KPI-ı fərqlidir.</p>`+funnel(['Tanınma (reach)','Maraq (engagement)','Qərar (DM, klik)','Alış','Loyallıq'])+`<p><b>SMART məqsəd:</b> «3 ayda Instagramdan gələn sifarişi 20 → 50 etmək.» KPI: reach, engagement rate, klik, DM sayı, satış, təkrar alış.</p><p class='tip'>Yalnız reach-a baxmaq (follower sayı) aldadıcıdır. Satış bağlayan mərhələləri də ölç.</p>`]],

['TikTok','TikTok və YouTube Shorts: ilk 3 saniyə',`<p>Qısa videoda <b>hook</b> (ilk 3 saniyə) qərarverici olur. Struktur: hook → dəyər/süjet → CTA. Trendlər faydalıdır, amma brend mesajına uyğun olmalıdır. Orijinallıq və real insanlar daha çox təsir edir.</p>`+flow(['Hook (0-3 san)','Problem','Həll','Nəticə','CTA'])+vs(`<p>«Salam, bu gün sizə bir şey göstərəcəyəm…» (uzun giriş).</p>`,`<p>«Bu 3 səhv səbəbindən satışın düşür» (dərhal maraq).</p>`)+`<p class='tip'>YouTube uzun video axtarışdan gəlir (SEO), Shorts isə kəşf üçündür. Eyni videonu uyğunlaşdırıb TikTok, Reels və Shorts-da paylaşmaq olar.</p>`],

['Copywriting','Güclü caption yazmaq: hook, AIDA, PAS',`<p><b>AIDA:</b> Attention, Interest, Desire, Action. <b>PAS:</b> Problem, Agitate (problemi dərinləşdir), Solution. Caption: güclü ilk sətir, qısa abzaslar, bir CTA.</p>`+vs(`<p>«Yeni məhsulumuz gəlib, alın.»</p>`,`<p>«Hər səhər gec qalırsan? 5 dəqiqəlik sağlam səhər yeməyi yeni menyuda. Bu gün sifariş ver.»</p>`)+`<p class='tip'>Bir post — bir mesaj — bir CTA (məs. «DM-ə yaz», «Linkə bax», «Saxla»).</p>`],

['Şikayət','Mənfi rəy: LAST yanaşması',`<p><b>LAST:</b> <b>L</b>isten (dinlə), <b>A</b>pologize (üzr istə), <b>S</b>olve (həll et), <b>T</b>hank (təşəkkür et). Mənfi şərhi silmək əvəzinə cavab vermək daha etibarlıdır, təhqir və spam isə qaydalara uyğun idarə olunur.</p>`+vs(`<p>«Bu sizin günahınızdır, biz düz işləyirik.»</p>`,`<p>«Narahatlığa görə üzr istəyirik. Sifarişinizi yoxlayıb 1 saat ərzində DM-də yazırıq.»</p>`)+`<p class='tip'><b>Case:</b> müştəri çatdırılmanın gecikməsini yazıb. Cavab: üzr, konkret həll (təcili çatdırılma/kompensasiya), sonra nəticənin yoxlanması.</p>`],
['Böhran','Böhran kommunikasiyası',`<p>Böhran: yanlış paylaşım, məhsul problemi, viral şikayət. Ardıcıllıq:</p>`+flow(['Planlı paylaşımı dayandır','Faktı yoxla','Qısa açıqlama','Tək səs','İzlə','Dərs çıxar'])+`<p>Qaydalar: tez, dürüst, <b>qısa</b> və empatik olun; xəta varsa etiraf edin; hər komanda üzvü ayrı cavab verməsin; sonra prosesi düzəldin.</p><p class='tip'><b>Case:</b> sosial şəbəkədə «məhsulunuzdan zəhərləndim» paylaşımı yayılır. Əvvəl hadisə yoxlanır, rəsmi açıqlama verilir, müştəri ilə birbaşa əlaqə saxlanır, daxili araşdırma aparılır.</p>`]],
q:[["LAST yanaşmasının ardıcıllığı?","Dinlə, üzr istə, həll et, təşəkkür et","Cavab ver, sil, bloklamaq, unut","Danış, yaz, göndər, sil","Gözlə, yoxla, sil, cavab ver"],["Böhran zamanı planlı paylaşımlar nə olmalıdır?","Müvəqqəti dayandırılmalıdır","Daha tez-tez paylaşılmalıdır","Dəyişdirilməməlidir","Yalnız şəkilli olmalıdır"]],
k:"Müştəri sosial şəbəkədə çatdırılmanın 2 gün gecikdiyini və pis xidməti paylaşıb. Ona 1 ictimai cavab və 1 DM mətni yaz, daxili tədbirləri sadala.",c:["Üzr və konkret həll","LAST strukturu","Daxili tədbirlər"]},
{t:"Meta Ads (Facebook və Instagram reklamı)",b:[""],L:[
['Struktur','Ads Manager strukturu və məqsədlər',`<p>Meta Ads üç səviyyədən ibarətdir:</p>`+tree(['Kampaniya','Reklam dəsti','Reklam'])+`<ul><li><b>Kampaniya:</b> məqsəd (Awareness, Traffic, Engagement, Leads, App promotion, Sales).</li><li><b>Reklam dəsti:</b> auditoriya, büdcə, yerləşdirmə, qrafik.</li><li><b>Reklam:</b> kreativ (şəkil/video), mətn, CTA düyməsi.</li></ul><p class='tip'>Interfeys tez dəyişir. Rəsmi Meta Business Help Center-ə baxın. Reklam üçün Meta Business hesabı, Facebook səhifəsi və ödəniş üsulu lazımdır.</p>`],
['Auditoriya','Auditoriya, büdcə və pixel',`<ul><li><b>Core:</b> yer, yaş, maraq, davranış.</li><li><b>Custom:</b> sayt ziyarətçiləri, müştəri siyahısı, video izləyənlər.</li><li><b>Lookalike:</b> mövcud müştərilərə bənzər auditoriya.</li></ul><p><b>Büdcə:</b> günlük və ya ömürlük. Təlim (learning) mərhələsində çox dəyişiklik etməyin. <b>Pixel və Conversions API:</b> saytda alış, qeydiyyat kimi hadisələri izləyir və optimallaşdırmaya kömək edir.</p>`+funnel(['Soyuq auditoriya','İzləyənlər','Sayta gələnlər','Səbət','Alış'])+`<p class='tip'><b>Retargeting:</b> sayta gəlib almayanlara yenidən reklam göstərmək. Bu adətən soyuq auditoriyadan ucuz nəticə verir.</p>`],
['Test','Kreativ, A/B test və nəticə qiymətləndirmə',`<p>Bir dəfəyə <b>bir dəyişən</b> test et: şəkil, mətn, CTA və ya auditoriya. Qiymətləndirmə: <b>CTR, CPC, CPA, ROAS</b>. Qərar: yaxşı nəticəni miqyasla (büdcəni tədricən artır), pisi dayandır və ya kreativi dəyiş.</p>`+vs(`<p>3 gün sonra nəticə yoxdur deyə hər şeyi silmək, hər dəfə 5 şeyi dəyişmək.</p>`,`<p>Yetərli data toplamaq, bir dəyişəni test etmək, qərarı rəqəmlərə əsaslandırmaq.</p>`)+`<p class='tip'><b>Reklam siyasəti:</b> yanıltıcı iddialar, sağlamlıq və maliyyə üzrə qadağan edilmiş vədlər, şəxsi xüsusiyyətlərə birbaşa işarələr (məs. «sən borclusan») qəbul olunmaya bilər.</p>`]],

{t:"Digər reklam platformaları",b:[""],L:[
['TikTok Ads','TikTok Ads',`<p>Struktur: <b>Kampaniya → Ad Group → Ad</b>. Formatlar: <b>In-Feed</b> reklam, <b>Spark Ads</b> (mövcud organik postu reklama çevirmək), Brand formatları. Kreativ <b>TikTok-a uyğun (native)</b> olmalıdır: real insan, sürətli giriş, trend səs, subtitr.</p>`+vs(`<p>Televiziya reklamı kimi parlaq, rəsmi və uzun video.</p>`,`<p>Telefonla çəkilmiş, hook ilə başlayan, 15-30 saniyəlik real dil.</p>`)+`<p class='tip'>Spark Ads yaxşı performans göstərən organik videonu miqyaslamaq üçün əlverişlidir.</p>`],
['Google Ads','Google Ads və YouTube',`<p>Google Ads <b>niyyətə</b> əsaslanır: insan nəsə axtarır. <b>Search</b> (axtarış nəticələri), <b>Display</b>, <b>YouTube</b>, <b>Shopping</b>, <b>Performance Max</b>. Əsas anlayışlar: <b>açar sözlər</b>, mənfi açar sözlər, reklam mətni, keyfiyyət göstəriciləri, aşağı mərhələ dönüşüm.</p>`+flow(['Axtarış','Açar söz','Reklam','Sayt','Dönüşüm'])+`<p class='tip'><b>Fərq:</b> Meta Ads insanı <b>kəşfə</b> yönəldir, Google Search isə artıq axtaran insanı tutur. Məsələn, «Bakıda kondisioner təmiri» axtarışı yüksək niyyətdir.</p>`],
['Seçim','Hansı platforma nə vaxt? Funnel və büdcə',`<ul><li><b>Tanınma:</b> TikTok, Instagram Reels, YouTube.</li><li><b>Maraq:</b> Instagram, Facebook.</li><li><b>Qərar:</b> Google Search, retargeting.</li><li><b>B2B:</b> LinkedIn Ads (daha yüksək klik qiyməti, dəqiq vəzifə hədəfi).</li></ul>`+bars([['Tanınma (TikTok/IG)',30],['Maraq (Meta)',30],['Axtarış (Google)',25],['Retargeting',15]])+`<p class='mut'>Yuxarıdakı bölgü <b>nümunədir</b>, hər biznesin funneli fərqlidir.</p><p class='tip'>Kiçik büdcə ilə: 1 platforma, 1 məqsəd, 2-3 kreativ ilə başla, sonra genişləndir.</p>`]],

['Metriklər','Əsas metriklər və formullar',`<ul><li><b>CTR</b> = klik ÷ göstərmə × 100</li><li><b>CPC</b> = xərc ÷ klik</li><li><b>CPM</b> = xərc ÷ göstərmə × 1000</li><li><b>CPA</b> = xərc ÷ alış</li><li><b>ROAS</b> = gəlir ÷ xərc</li></ul><p><b>Nümunə:</b> xərc 200 AZN, göstərmə 50 000, klik 1000, alış 20, gəlir 800 AZN. CTR = 2%, CPC = 0,20, CPM = 4, CPA = 10, ROAS = 4.</p>`+bars([['CTR (%)',20],['ROAS (x)',40],['CPA (AZN)',10]])+`<p class='tip'>Excel: <code>=B2/C2</code> (CTR), <code>=A2/B2</code> (CPC), <code>=D2/A2</code> (ROAS). Hər biznesdə «yaxşı» rəqəm fərqlidir, mənfəətlə müqayisə et.</p>`],
['İzləmə','Analitika alətləri və UTM',`<p>Alətlər: <b>Meta Insights</b>, <b>Google Analytics 4</b>, <b>Looker Studio</b> (hesabat paneli). <b>UTM</b> linkdəki etiketlərdir və trafikin haradan gəldiyini göstərir: <code>utm_source=instagram&utm_medium=paid&utm_campaign=yaz_endirimi</code>.</p>`+flow(['Link + UTM','Klik','Sayt','GA4 hadisə','Hesabat'])+`<p><b>Aylıq hesabat strukturu:</b> məqsəd, əsas rəqəmlər, ən yaxşı kontent, ən pis kontent, nəticə, növbəti ay planı.</p>`],
['Hüquq','Reklam hüququ və etika',`<ul><li>Reklam <b>aldadıcı</b> olmamalıdır (qiymət, xüsusiyyət, nəticə).</li><li>Müəllif hüququ: musiqi, şəkil və video üçün icazə lazımdır.</li><li>Şəxsi məlumatlar razılıqla və məqsədə uyğun toplanmalıdır.</li><li>Influencer paylaşımı <b>reklam kimi şəffaf işarələnməlidir</b>.</li><li>Uşaqlara hədəflənən və sağlamlıq/maliyyə reklamlarında xüsusi ehtiyatlı olun.</li></ul>`+vs(`<p>«Yalnız 3 günə 10 kq arıqlayın, zəmanətli!»</p>`,`<p>«Sağlam qidalanma planı: fərdi təyinat və nəticə şəxsdən asılıdır.»</p>`)+`<p class='tip'>Konkret ölkə qaydalarını və platforma siyasətini rəsmi mənbədən yoxlayın. Bu kurs təhsil məqsədlidir, hüquqi məsləhət deyil.</p>`]],
