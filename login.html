<style>
  :root { --accent:#4da3ff; --accent2:#7c8cff; --text:#eaf2ff; --muted:rgba(234,242,255,.68); --line:rgba(160,190,255,.25); }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body {
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#030716 0%,#071433 38%,#0d2a6b 72%,#143c91 100%);
    background-size:200% 200%;
    animation:sky 22s ease-in-out infinite alternate;
    overflow-x:hidden;
  }
  @keyframes sky { from { background-position:0% 0%; } to { background-position:100% 100%; } }

  /* Hərəkətli işıq dumanları */
  .glow { position:fixed; border-radius:50%; filter:blur(70px); opacity:.5; pointer-events:none; z-index:0; }
  .g1 { width:340px; height:340px; background:#1f5fff; top:-80px; left:-100px; animation:drift1 18s ease-in-out infinite alternate; }
  .g2 { width:300px; height:300px; background:#6a4dff; bottom:-90px; right:-80px; animation:drift2 24s ease-in-out infinite alternate; }
  .g3 { width:220px; height:220px; background:#00b7ff; top:45%; left:55%; opacity:.28; animation:drift3 20s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform:translate(180px,140px) scale(1.2); } }
  @keyframes drift2 { to { transform:translate(-200px,-120px) scale(1.15); } }
  @keyframes drift3 { to { transform:translate(-160px,90px) scale(.8); } }

  #stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  .wrap { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }
  .header { display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--line);
            background:rgba(5,11,31,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .logo { font-weight:800; font-size:20px; color:#fff; text-decoration:none; white-space:nowrap; }
  .nav { display:flex; gap:16px; overflow-x:auto; flex:1; scrollbar-width:none; }
  .nav::-webkit-scrollbar { display:none; }
  .nav a { color:var(--muted); text-decoration:none; font-size:14px; white-space:nowrap; transition:color .2s; }
  .nav a:hover { color:#fff; }
  .cta { padding:8px 14px; border-radius:999px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; text-decoration:none; font-weight:700; font-size:14px; white-space:nowrap; }

  .main { flex:1; display:flex; align-items:center; justify-content:center; padding:28px 16px; }
  .card {
    width:100%; max-width:400px; padding:30px 24px; border-radius:22px;
    background:rgba(255,255,255,.07); border:1px solid var(--line);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,10,50,.55), inset 0 1px 0 rgba(255,255,255,.12);
    animation:rise .7s ease both;
  }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
  .eyebrow { font-size:12px; letter-spacing:.16em; font-weight:700; color:var(--accent); margin:0 0 6px; }
  .card h1 { margin:0 0 6px; font-size:29px; line-height:1.15; }
  .sub { margin:0 0 20px; color:var(--muted); font-size:15px; }
  .card input {
    width:100%; padding:13px 14px; margin-bottom:10px; border-radius:12px;
    border:1px solid var(--line); background:rgba(3,8,30,.45); color:#fff; font:inherit; font-size:16px;
    transition:border-color .2s, box-shadow .2s;
  }
  .card input::placeholder { color:rgba(234,242,255,.45); }
  .card input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(77,163,255,.25); }
  .card button { width:100%; padding:13px; border-radius:12px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:transform .15s, box-shadow .2s; }
  .card button:active { transform:scale(.98); }
  .primary { border:0; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 24px rgba(77,130,255,.45); }
  .google { margin-top:8px; border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--text); }
  .msg { min-height:20px; margin-bottom:8px; font-size:14px; color:#ff8a80; }
  .msg.ok { color:#7dffb0; }
  .or { text-align:center; color:var(--muted); font-size:13px; margin:12px 0 0; }
  .links { display:flex; justify-content:space-between; margin-top:16px; font-size:14px; }
  .links a { color:var(--accent); text-decoration:none; }
  .footer { padding:20px 18px; border-top:1px solid var(--line); text-align:center; font-size:13px; color:var(--muted); background:rgba(5,11,31,.45); }
  .footer b { display:block; font-size:16px; color:#fff; margin-bottom:2px; }
  .footer a { color:var(--muted); margin:0 6px; }

  @media (prefers-reduced-motion: reduce) {
    body, .glow, .card { animation:none !important; }
  }
</style>

<body>

<script>
(function () {
  var c = document.getElementById("stars"), x = c.getContext("2d");
  var W, H, stars = [], shoot = null, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize() {
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(W * H / 6500);
    stars = [];
    for (var i = 0; i < n; i++) stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.4 + .3,
      p: Math.random() * 6.28, s: Math.random() * 1.6 + .4,
      vy: Math.random() * .08 + .01
    });
  }

  function newShoot() {
    shoot = { x: Math.random() * W * .8, y: Math.random() * H * .35, l: 0, v: 9 + Math.random() * 5 };
  }

  function frame(t) {
    x.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = .35 + .65 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
      x.globalAlpha = a;
      x.fillStyle = "#cfe3ff";
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.28); x.fill();
      if (!reduce) { s.y += s.vy; if (s.y > H) s.y = 0; }
    }
    if (shoot) {
      shoot.l += shoot.v;
      var ex = shoot.x + shoot.l, ey = shoot.y + shoot.l * .55;
      var sx = ex - 140, sy = ey - 140 * .55;
      var g = x.createLinearGradient(sx, sy, ex, ey);
      g.addColorStop(0, "rgba(180,215,255,0)");
      g.addColorStop(1, "rgba(255,255,255,.95)");
      x.globalAlpha = 1; x.strokeStyle = g; x.lineWidth = 2;
      x.beginPath(); x.moveTo(sx, sy); x.lineTo(ex, ey); x.stroke();
      if (ex > W + 150 || ey > H + 150) shoot = null;
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  resize();
  addEventListener("resize", resize);
  requestAnimationFrame(frame);
  if (!reduce) (function loop() { newShoot(); setTimeout(loop, 4000 + Math.random() * 5000); })();
})();
</script>

<script type="module">
import { auth } from "./firebase-config.js";
import {
  GoogleAuthProvider, signInWithPopup, onAuthStateChanged,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail,
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const $ = (id) => document.getElementById(id);
let mode = "login";

// Giriş sonrası yönləndirmə (yalnız eyni saytın .html səhifələri)
const nextParam = new URLSearchParams(location.search).get("next") || "";
const next = /^[\w\-]+\.html$/.test(nextParam) ? nextParam : "index.html";

const errors = {
  "auth/invalid-email": "E-poçt düzgün deyil.",
  "auth/missing-password": "Şifrəni yaz.",
  "auth/weak-password": "Şifrə ən azı 6 simvol olmalıdır.",
  "auth/email-already-in-use": "Bu e-poçt artıq qeydiyyatdadır.",
  "auth/invalid-credential": "E-poçt və ya şifrə səhvdir.",
  "auth/user-not-found": "Bu e-poçtla hesab yoxdur.",
  "auth/wrong-password": "Şifrə səhvdir.",
  "auth/too-many-requests": "Çox cəhd oldu, bir az sonra yenidən yoxla.",
  "auth/unauthorized-domain": "Bu domen Firebase-də icazəli deyil.",
  "auth/popup-closed-by-user": "",
};
const msg = (t, ok) => { $("msg").className = "msg" + (ok ? " ok" : ""); $("msg").textContent = t; };
const fail = (err) => msg(errors[err.code] ?? "Xəta: " + err.code);

function setMode(m) {
  mode = m;
  $("title").textContent = m === "login" ? "Daxil ol" : "Qeydiyyat";
  $("sub").textContent = m === "login" ? "Kurslara və sertifikatlara çıxış üçün hesabına daxil ol." : "Yeni hesab yarat, bir neçə saniyə çəkir.";
  $("submit").textContent = m === "login" ? "Daxil ol" : "Qeydiyyatdan keç";
  $("switch").textContent = m === "login" ? "Qeydiyyat" : "Hesabım var";
  $("pass").autocomplete = m === "login" ? "current-password" : "new-password";
  msg("");
}

$("switch").onclick = (e) => { e.preventDefault(); setMode(mode === "login" ? "signup" : "login"); };

$("submit").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value;
  try {
    if (mode === "login") await signInWithEmailAndPassword(auth, email, pass);
    else await createUserWithEmailAndPassword(auth, email, pass);
  } catch (err) { fail(err); }
};

$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("submit").click(); });

$("google").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (err) { fail(err); }
};

$("reset").onclick = async (e) => {
  e.preventDefault();
  const email = $("email").value.trim();
  if (!email) return msg("Əvvəlcə e-poçtu yaz.");
  try { await sendPasswordResetEmail(auth, email); msg("Bərpa linki e-poçta göndərildi.", true); }
  catch (err) { fail(err); }
};

// Giriş uğurlu olanda (və ya artıq daxil olubsa) yönləndir
onAuthStateChanged(auth, (user) => { if (user) location.replace(next); });
</script>
